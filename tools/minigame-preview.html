<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{
  --bg:#f2f4f6; --card:#ffffff; --card2:#f1f4f7; --line:#d9dee5; --line2:#e9edf1;
  --txt:#1b2230; --dim:#5d6875; --mute:#8b949e;
  --green:#1f9d55; --green2:#17813f; --green-bg:#eaf7ef; --green-line:#a8dcbb;
  --gold:#b7860b; --gold-bg:#fbf6e8; --gold-line:#ead7a4;
  --red:#c9463c; --red-bg:#fdf1ef; --red-line:#efc1bc;
  --blue:#2c6fb7; --blue-bg:#edf3fa; --ink:#ffffff;
  --team1:#1f9d55; --team2:#17813f; --team-ink:#ffffff; --team-a:rgba(31,157,85,.06);
  --shadow:0 1px 2px rgba(20,30,40,.05),0 2px 8px rgba(20,30,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums;min-height:100vh;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
h2,h3,.hint,.evcard .txt{text-wrap:balance}
.ic{width:1.05em;height:1.05em;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:square;stroke-linejoin:miter;flex:none;display:inline-block}
.ic+*{margin-left:0}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;position:sticky;top:0;background:#fff;z-index:5;box-shadow:0 1px 0 var(--line)}
header:after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--team1) 0 72%,var(--team2) 72% 100%)}
header h1{font-size:17px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
header h1 .ic{color:var(--team1);width:20px;height:20px}
header h1 span{color:var(--mute);font-weight:400}
#hdInfo{color:var(--dim);font-size:12.5px;text-align:right}
main{max-width:760px;margin:0 auto;padding:20px 16px calc(60px + env(safe-area-inset-bottom))}
section{display:none}
section.on{display:block;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:12.5px;margin-bottom:12px;color:var(--dim);font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.card h2:before{content:'';width:3px;height:12px;background:var(--team1);flex:none}
.card h2 .ic{color:var(--mute)}
.crest{display:inline-flex;align-items:center;justify-content:center;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);color:#fff;font-weight:800;vertical-align:-3px;margin-right:6px;text-shadow:0 1px 2px rgba(0,0,0,.45);flex:none}
img.crest{clip-path:none;object-fit:contain;text-shadow:none;background:transparent}
.flag{display:inline-block;margin-right:5px;vertical-align:-1px;line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;background:var(--green);color:#fff;border:none;padding:10px 20px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s,border-color .15s;letter-spacing:.5px}
.btn:hover{background:var(--green2)}
.btn:active{transform:translateY(1px);background:#136b34}
.btn:disabled{background:#cfd5dc;color:#8a939d;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--card2);border-color:var(--green)}
.btn.ghost:active{background:#e6ebef}
.btn.sm{min-height:40px;padding:6px 10px;font-size:13px;font-weight:600}
.btn.wide{min-width:200px}
.badge{display:inline-block;min-width:20px;font-size:11.5px;line-height:18px;padding:0 5px;background:var(--gold);color:#fff;font-weight:700}
.badge:empty{display:none}
.btn small{font-size:11px;font-weight:400;opacity:.8;border:1px solid rgba(255,255,255,.5);padding:0 5px}
.btn.link{background:none;color:var(--dim);min-height:36px;padding:4px 8px;font-size:12.5px;font-weight:400}
.btn.link:hover{color:var(--green2);background:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input[type=text]{background:#fff;border:1px solid var(--line);color:var(--txt);padding:11px 14px;font-size:16px;width:100%;min-height:44px}
input[type=text]:focus{outline:none;border-color:var(--green)}
/* 开始页 */
.start{margin-top:36px;padding:36px 20px;text-align:center}
.start .ic.big{width:44px;height:44px;color:var(--green);stroke-width:1.5}
.start h2{justify-content:center;color:var(--txt);font-size:22px;letter-spacing:1px;margin:12px 0 8px}
.start h2:before{display:none}
.start p{color:var(--dim);font-size:14px;line-height:1.7;margin:0 auto 22px;max-width:420px}
/* 球员证 */
.idcard{border-top:4px solid var(--team1);background:linear-gradient(90deg,#fff 0 55%,rgba(255,255,255,0) 100%),repeating-linear-gradient(135deg,transparent 0 9px,var(--team-a) 9px 18px),#fff;padding-top:14px}
.pcard{display:flex;gap:14px;align-items:stretch}
.ovr{width:76px;min-height:84px;background:linear-gradient(160deg,var(--team1),var(--team2));display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--team-ink);flex:none;position:relative}
.ovr b{font-size:32px;line-height:1;letter-spacing:-1px}
.ovr span{font-size:11px;opacity:.85;margin-top:4px;letter-spacing:2px}
.pinfo{min-width:0}
.id-name{display:flex;align-items:baseline;gap:8px}
.id-name b{font-size:20px;letter-spacing:1px}
.id-name span{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:1px 6px;background:#fff}
.id-club{display:flex;align-items:center;font-size:13.5px;font-weight:600;margin-top:6px}
.id-club img.crest,.id-club .crest{margin-right:6px}
.id-club small{font-weight:400;color:var(--dim);margin-left:6px}
.id-meta{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.6}
.id-meta .hot{color:var(--gold)}.id-meta .cold{color:var(--blue)}
.id-season{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 4px;border:1px solid var(--line2);background:rgba(255,255,255,.85)}
.id-season div{padding:8px 4px;text-align:center;border-right:1px solid var(--line2)}
.id-season div:last-child{border:none}
.id-season b{display:block;font-size:18px;line-height:1.1}
.id-season span{font-size:11px;color:var(--dim)}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px;margin-top:12px}
.attr{display:flex;align-items:center;gap:8px;font-size:13px}
.attr .nm{width:30px;color:var(--dim)}
.attr .bar{flex:1;height:6px;background:#e3e8ee;overflow:hidden;position:relative}
.attr .bar i{display:block;height:100%;background:var(--green);transition:width .4s ease-out}
.attr .vl{width:28px;text-align:right;font-weight:700;position:relative}
.attr .up{position:absolute;right:-2px;top:-14px;font-size:10px;color:var(--green2);font-weight:700;animation:upf 1.6s ease-out both}
.attr.flash .bar i{animation:barf 1s ease-out}
@keyframes upf{0%{opacity:0;transform:translateY(4px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@keyframes barf{0%,40%{filter:brightness(1.6)}100%{filter:none}}
.id-foot{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--dim)}
.id-foot span{display:inline-flex;align-items:center;gap:5px}
.id-foot b{color:var(--txt)}
.id-foot .honor{color:var(--gold)}
.id-foot .honor b{color:var(--gold)}
/* 下一场：海报 */
.poster{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 0 4px}
.pt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.pt .crest,.pt img.crest{margin:0}
.pt .flag{margin:0}
.pt b{font-size:14.5px;line-height:1.3;word-break:keep-all}
.pt.me b{color:var(--txt)}
.pt span{font-size:11.5px;color:var(--dim)}
.vs{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 6px}
.vs .comp{font-size:11.5px;color:#fff;background:var(--txt);padding:2px 8px;white-space:nowrap}
.vs b{font-size:22px;font-weight:800;letter-spacing:2px;color:var(--mute);font-style:italic}
.vs span{font-size:11.5px;color:var(--dim);white-space:nowrap}
.nx-lines{font-size:13px;line-height:1.7;margin-top:8px}
.nx-lines div{display:flex;gap:6px;align-items:flex-start;color:var(--dim)}
.nx-lines .ic{margin-top:.25em}
.nx-lines .warn{color:var(--red)}.nx-lines .caut{color:var(--gold)}
.tacs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tac{font:inherit;font-size:13px;min-height:42px;border:1px solid var(--line);background:#fff;color:var(--txt);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background .15s,border-color .15s}
.tac:hover{border-color:var(--green)}
.tac.on{background:var(--txt);border-color:var(--txt);color:#fff}
.tac-note{color:var(--dim);font-size:12px;margin-top:6px;line-height:1.6}
#hBtns{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-top:14px}
#hBtns .btn{padding:10px 6px;min-width:0}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line2)}
th{color:var(--dim);font-weight:600;font-size:12px;background:var(--card2);border-bottom:1px solid var(--line)}
td.nm,th.nm{text-align:left}
td.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
td.rk{position:relative;color:var(--dim);width:30px}
td.rk.z1:before,td.rk.z2:before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:3px}
td.rk.z1:before{background:var(--green)}td.rk.z2:before{background:var(--blue)}
td.pts{font-weight:700}
tr.me td{color:var(--green2);font-weight:700;background:var(--green-bg)}
tr.gap td{color:var(--mute);padding:2px;font-size:11px;letter-spacing:3px;border-bottom:1px solid var(--line2)}
.tlegend{display:flex;gap:12px;font-size:11.5px;color:var(--dim);margin-top:8px;align-items:center;flex-wrap:wrap}
.tlegend i{display:inline-block;width:3px;height:10px;margin-right:5px;vertical-align:-1px}
/* 比赛：转播记分牌 */
.sbcard{padding:0;overflow:hidden;border:none;background:var(--txt);color:#fff}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.sb-t{display:flex;align-items:center;gap:8px;padding:12px 12px;font-size:14px;font-weight:700;min-width:0}
.sb-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-t.r{flex-direction:row-reverse;text-align:right}
.sb-t .kit{width:6px;align-self:stretch;flex:none;margin:-12px 0}
.sb-t .crest,.sb-t img.crest,.sb-t .flag{margin:0}
.sb-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f141c;padding:6px 14px;min-width:92px}
.sb-score{font-size:24px;font-weight:800;letter-spacing:2px;line-height:1.1}
.sb-score.bump{animation:bump .5s ease-out}
@keyframes bump{0%{transform:scale(1.35);color:#ffe27a}100%{transform:none}}
.sb-min{font-size:12px;color:#0f141c;background:#ffd34d;padding:1px 8px;margin-top:4px;font-weight:700}
.logcard{position:relative;padding:8px 6px}
#mlog{height:300px;overflow-y:auto;font-size:13.5px;line-height:1.75;padding:2px}
#mlog p{display:flex;gap:8px;padding:5px 6px;border-bottom:1px solid var(--line2);animation:logIn .25s ease-out}
@keyframes logIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#mlog .lm{flex:none;min-width:34px;font-size:11.5px;font-weight:700;color:var(--dim);background:var(--card2);text-align:center;align-self:flex-start;margin-top:2px;padding:0 4px}
#mlog p.g{color:var(--green2);font-weight:700;background:var(--green-bg)}
#mlog p.g .lm{background:var(--green);color:#fff}
#mlog p.b{color:var(--red)}
#mlog p.b .lm{background:var(--red);color:#fff}
#mlog p.y{color:#8a6608}
#mlog p.d{color:var(--dim)}
#mlog p.k{color:var(--txt);font-weight:600}
#mlog p.k .lm{background:var(--txt);color:#fff}
.goalfx{position:absolute;left:0;right:0;top:40%;display:flex;flex-direction:column;align-items:center;padding:14px 10px;background:var(--team1);color:var(--team-ink);pointer-events:none;opacity:0;transform:scaleY(0);z-index:3}
.goalfx b{font-size:28px;letter-spacing:8px;font-weight:900}
.goalfx span{font-size:13px;opacity:.9;margin-top:2px}
.goalfx.on{animation:gfx .95s ease-out both}
@keyframes gfx{0%{opacity:0;transform:scaleY(0)}15%{opacity:1;transform:scaleY(1)}80%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(.6)}}
/* 小游戏弹窗 */
#overlay{position:fixed;inset:0;background:rgba(15,22,30,.62);display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .18s ease-out}
#overlay.hidden{display:none}
.gamebox{background:var(--card);padding:14px;text-align:center;width:514px;max-width:96vw;max-height:96dvh;overflow:auto;box-shadow:0 12px 36px rgba(0,0,0,.28);border-top:4px solid var(--team1)}
.gamebox h3{margin-bottom:4px;font-size:17px;display:flex;align-items:center;justify-content:center}
.gamebox h3 .gmin{display:inline-block;background:var(--txt);color:#fff;font-size:12px;line-height:1;padding:4px 7px;margin-right:8px}
.gamebox .hint{color:var(--gold);font-size:13px;margin-bottom:10px;min-height:20px;line-height:1.5}
.gamebox .hint.dim{color:var(--dim)}
.cvwrap{position:relative;line-height:0}
#cv{display:block;width:100%;height:auto;aspect-ratio:480/330;background:#3a9a5c;cursor:crosshair;max-width:100%;touch-action:none;-webkit-touch-callout:none;outline:none;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
#cv:focus-visible{box-shadow:0 0 0 2px var(--team1)}
#gRes{position:absolute;left:50%;top:10px;transform:translateX(-50%);line-height:1.3;pointer-events:none;opacity:0}
#gRes.on{animation:drop .42s cubic-bezier(.2,.9,.3,1.25) both}
#gRes b{display:block;font-size:20px;letter-spacing:2px;color:#fff;padding:6px 18px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#gRes b.ok{background:var(--green)}#gRes b.mid{background:var(--gold)}#gRes b.bad{background:var(--red)}
#gRes small{display:block;font-size:12px;background:rgba(15,20,28,.78);color:#fff;padding:3px 10px;margin-top:4px;text-align:center}
@keyframes drop{from{opacity:0;transform:translate(-50%,-30px)}to{opacity:1;transform:translate(-50%,0)}}
#gBtns{margin-top:10px;min-height:44px}
/* 赛后 */
.big{font-size:36px;font-weight:800;text-align:center;padding:6px 0 2px;letter-spacing:2px}
#rVs{font-size:13.5px}
.rate{display:flex;justify-content:center;align-items:stretch;margin:14px auto 14px;width:max-content}
.rate b{font-size:34px;line-height:1;padding:10px 16px;color:#fff;background:var(--mute);min-width:96px;text-align:center}
.rate span{display:flex;align-items:center;padding:0 12px;font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-left:none;background:#fff}
.rate.r-gold b{background:var(--gold)}.rate.r-green b{background:var(--green)}.rate.r-grey b{background:#7b8692}.rate.r-red b{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat{background:var(--card2);padding:10px 4px;border-left:3px solid var(--team1)}
.stat b{font-size:22px;display:block;line-height:1.2}
.stat span{font-size:12px;color:var(--dim)}
.stats>p{grid-column:1/-1;text-align:center}
.tnote{color:var(--dim);font-size:13px;text-align:center;margin-top:12px;line-height:1.8}
.tnote b{font-variant-numeric:tabular-nums}
/* 训练 */
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.trow:last-child{border:none}
.trow .nm{width:40px}
.trow .bar{flex:1;height:8px;background:#e3e8ee;overflow:hidden}
.trow .bar i{display:block;height:100%;background:var(--blue);transition:width .35s ease-out}
.trow .vl{width:44px;text-align:right;font-weight:800;font-size:16px;position:relative}
.trow .vl em{font-style:normal;font-size:11px;color:var(--green2);position:absolute;right:0;top:-12px;animation:upf 1.2s ease-out both}
.trow.flash .bar i{animation:barf .9s ease-out}
.trow .cost{width:52px;color:var(--dim);font-size:12px;text-align:right}
.plus{width:44px;height:44px;border:none;background:var(--green);color:#fff;font-size:20px;font-weight:800;cursor:pointer;transition:background .15s,transform .1s}
.plus:active{transform:translateY(1px);background:var(--green2)}
.plus:disabled{background:#cfd5dc;color:#8a939d;cursor:not-allowed;transform:none}
#tpLeft{color:var(--gold);font-weight:800}
.center{text-align:center}
.mt{margin-top:12px}
.honor{color:var(--gold)}
.muted{color:var(--dim);font-size:13px}
/* 事件弹窗 */
#evOverlay{position:fixed;inset:0;background:rgba(15,22,30,.62);display:flex;align-items:center;justify-content:center;z-index:30;animation:fade .18s ease-out}
#evOverlay.hidden{display:none}
.evcard{background:var(--card);border-top:4px solid var(--team1);padding:22px;max-width:420px;width:92vw;box-shadow:0 12px 36px rgba(0,0,0,.28);max-height:88vh;overflow-y:auto}
.evcard h3{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.evcard .txt{color:var(--txt);font-size:14.5px;line-height:1.85;margin-bottom:16px;min-height:40px}
.evbtn{display:block;width:100%;text-align:left;background:#fff;color:var(--txt);border:1px solid var(--line);border-left:3px solid var(--line);padding:12px 14px;min-height:44px;font:inherit;font-size:14px;cursor:pointer;margin-top:8px;transition:background .15s,border-color .15s,transform .1s;line-height:1.6}
.evbtn:hover{background:var(--card2);border-color:var(--green);border-left-color:var(--green)}
.evbtn:active{transform:translateY(1px)}
.evcard .btn{width:100%}
/* 生活 */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.lrow:last-child{border:none}
.lrow .info{flex:1}
.lrow .info b{font-size:15px}
.lrow .info span{display:block;color:var(--dim);font-size:12.5px;margin-top:3px}
.lrow .btn{min-width:88px}
.box2{background:var(--card2);border-left:3px solid var(--green);padding:10px 12px;margin-top:8px}
/* 档案 */
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:10px;background:var(--gold-bg);border:1px solid var(--gold-line);text-align:left}
.ach .ic{color:var(--gold);width:22px;height:22px;margin-top:1px}
.ach b{font-size:13.5px;display:block}
.ach span{font-size:12px;color:var(--dim);display:block;margin-top:2px;line-height:1.5}
.ach.lock{background:var(--card2);border-color:var(--line2)}
.ach.lock .ic{color:#b9c0c8}
.ach.lock b{color:var(--mute)}
.ach.perk{background:#fff;border-color:var(--line)}
.ach.perk .ic{color:var(--team1)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line2);margin-top:14px;font-size:13.5px}
.toggle button{font:inherit;font-size:12.5px;min-height:36px;min-width:64px;border:1px solid var(--line);background:#fff;cursor:pointer}
.toggle button.on{background:var(--green);color:#fff;border-color:var(--green)}
/* ---- 局面面板 / 对手特点 / 小目标 / 赛后条目 / 纪念册 ---- */
.acts{display:grid;gap:8px;text-align:left}
.act{display:flex;gap:10px;align-items:flex-start;width:100%;background:#fff;border:1px solid var(--line);border-left:3px solid var(--line);padding:10px 12px;cursor:pointer;font:inherit;color:var(--txt);text-align:left;transition:background .15s,border-color .15s,transform .1s;min-height:44px}
.act:hover{background:var(--card2);border-color:var(--green)}
.act:active{transform:translateY(1px);background:#e7ece9}

.tags{display:flex;gap:6px;flex-wrap:wrap}

.chips{display:flex;gap:6px;flex-wrap:wrap}

.album{margin-top:6px}
.al{display:flex;gap:10px}
.al-age{flex:none;width:38px;font-size:12px;color:var(--dim);text-align:right;padding-top:9px;font-variant-numeric:tabular-nums}

.al.big .al-card b{color:var(--gold)}
.al-card span{display:flex;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:2px}

function drawG(){
  ctx.clearRect(0,0,480,330);
  const shake=G.phase===2&&G.post&&G.anim>G.animLen&&G.anim<G.animLen+12&&!reduceMotion();
  ctx.save();if(shake)ctx.translate((Math.random()-.5)*4,(Math.random()-.5)*3);

  let kx=G.kx,dive=0;

    const p=Math.min(G.anim/G.animLen,1);
    const tgt=(G.res==='save'||G.res==='wow')?G.ball.x:G.kxF+(G.ball.x-G.kxF)*0.4;
    kx=G.kxF+(clamp(tgt,GOAL.x1,GOAL.x2)-G.kxF)*p;
    dive=(Math.sign(G.ball.x-G.kxF)||1)*0.8*p;
  }
  ctx.save();
  if(G.phase===2&&(G.res==='save'||G.res==='wow')){
    const reach=easeMini(G.anim/G.animLen),d=Math.sign(dive)||1;
    const handX=kx+d*40*Math.cos(dive)+82*Math.sin(dive);
    const handY=228+d*40*Math.sin(dive)-82*Math.cos(dive);

    ctx.fillStyle='rgba(87,184,123,.85)';ctx.fillRect(240-W,296,W*2,22);       // 精准区（随射门变宽）

    const curve=G.situ&&G.situ.id==='fk'?(G.ball.x>=G.wallX?1:-1)*5*Math.sin(Math.PI*p):0;
    let x=sx+(G.ball.x-sx)*p+curve, y=sy+(G.ball.y-sy)*p;

      ctx.strokeStyle='rgba(255,224,102,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(G.ball.x,G.ball.y,6,0,7);ctx.stroke();

        x=G.ball.x+Math.sign(G.ball.x-240||1)*32*p2;

      }else if(G.res==='goal'){                // 球进：球陷进网里，网向后鼓起
        y=G.ball.y+4*Math.min(p2*3,1);
        if(!reduceMotion()){
          const a=Math.sin(Math.PI*Math.min(p2*1.4,1));
          ctx.fillStyle=`rgba(0,0,0,${0.2*a})`;ctx.beginPath();ctx.ellipse(x,y,18,13,0,0,7);ctx.fill();
          ctx.strokeStyle=`rgba(255,255,255,${0.55*a})`;ctx.lineWidth=1.2;
          for(let r=10;r<=34;r+=8){ctx.beginPath();ctx.ellipse(x,y,r*(1+0.25*a),r*0.72*(1+0.25*a),0,0,7);ctx.stroke()}
        }
      }
    }
    if(p<1&&!reduceMotion())for(let i=3;i>=1;i--){ // 尾迹
      const q=Math.max(0,p-i*0.06);
      ctx.fillStyle=`rgba(255,255,255,${0.1*(4-i)})`;ctx.beginPath();ctx.arc(sx+(G.ball.x-sx)*q,sy+(G.ball.y-sy)*q,(9-4*q)*0.85,0,7);ctx.fill();
    }
    if(G.post&&p>=1){
      const p2=Math.min((G.anim-G.animLen)/24,1);
      ctx.globalAlpha=1-p2;ctx.fillStyle='#ffe27a';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
      ctx.fillText('当',G.postX+(G.postDir>0?18:-18),G.postY-12-10*p2);ctx.globalAlpha=1;
    }
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+3+6*(1-p),7-3*p,3-p,0,0,7);ctx.fill(); // 影子表现深度
    drawBallSpin(x,y,9-4*p,G.anim*0.4*(p<1?1:0.2));
  }
  ctx.restore();
}
function crosshair(x,y,c){
  ctx.strokeStyle=c;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-16,y);ctx.lineTo(x+16,y);ctx.moveTo(x,y-16);ctx.lineTo(x,y+16);ctx.stroke();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();ctx.fill();
}
function glove(x,y){
  ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(x,y,5.5,0,7);ctx.fill();
  ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;ctx.stroke();
}
function drawKeeper(kx,dive){
  const gk=KIT().gk;
  // 阴影
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(kx,251,28,6,0,0,7);ctx.fill();
  ctx.save();
  if(dive){ctx.translate(kx,228);ctx.rotate(dive);ctx.translate(-kx,-228)}
  const sway=dive?0:Math.sin(G.t*0.09)*2;
  ctx.lineCap='round';
  // 腿
  ctx.strokeStyle='#0f172a';ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(kx-8,210);ctx.lineTo(kx-12,244);ctx.stroke();
  ctx.beginPath();ctx.moveTo(kx+8,210);ctx.lineTo(kx+12,244);ctx.stroke();
  // 球袜
  ctx.strokeStyle=gk.c2;ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(kx-11,232);ctx.lineTo(kx-12,243);ctx.stroke();
  ctx.beginPath();ctx.moveTo(kx+11,232);ctx.lineTo(kx+12,243);ctx.stroke();
  // 球鞋
  ctx.fillStyle='#111827';
  ctx.beginPath();ctx.ellipse(kx-14,247,8,4,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(kx+14,247,8,4,0,0,7);ctx.fill();
  // 短裤
  ctx.fillStyle='#1e293b';
  roundRect(kx-15,194,30,20,5);
  // 躯干球衣（渐变+袖口）
  const jg=ctx.createLinearGradient(kx-17,0,kx+17,0);
  jg.addColorStop(0,shade(gk.c1,0.12));jg.addColorStop(.5,gk.c1);jg.addColorStop(1,gk.c2);
  ctx.fillStyle=jg;
  roundRect(kx-17,157,34,42,8);
  // 号码
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
  ctx.fillText('1',kx,186);
  // 手臂+手套：扑救时双臂伸向侧上方，站立时垂在体侧微晃
  ctx.strokeStyle=gk.c1;ctx.lineWidth=8;
  if(dive){
    const d=Math.sign(dive);
    ctx.beginPath();ctx.moveTo(kx-6,164);ctx.lineTo(kx+d*40,146);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx+6,168);ctx.lineTo(kx+d*46,160);ctx.stroke();
    glove(kx+d*40,146);glove(kx+d*46,160);
  }else{
    ctx.beginPath();ctx.moveTo(kx-14,164);ctx.lineTo(kx-26,193+sway);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx+14,164);ctx.lineTo(kx+26,193-sway);ctx.stroke();
    glove(kx-26,196+sway);glove(kx+26,196-sway);
  }
  // 头+头发
  ctx.fillStyle='#f1c27d';
  ctx.beginPath();ctx.arc(kx,143,11,0,7);ctx.fill();
  ctx.fillStyle='#292018';
  ctx.beginPath();ctx.arc(kx,141,11,Math.PI,Math.PI*2);ctx.fill();
  ctx.restore();
}

const TRAITS={
 slow:{n:'中卫转身慢',fit:['c_drib','w_cut','e_drib']},
 press:{n:'后卫喜欢上抢',fit:['c_pass','e_12']},

 wing:{n:'边路回防慢',fit:['w_cross']},
};
const TRAIT_IDS=Object.keys(TRAITS);
function hstr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function srng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function oppTraits(name){ // 每支球队固定两个特点：由队名算出，同一支队永远一样
  const pairs=[];
  for(let i=0;i<TRAIT_IDS.length;i++)for(let j=i+1;j<TRAIT_IDS.length;j++)pairs.push([TRAIT_IDS[i],TRAIT_IDS[j]]);
  return pairs[hstr(name)%pairs.length];
}
function intelKey(name){return `${S.player.season}|${S.round}|${(S.cupQ||[]).length}|${name}`}
function intelFor(opp){ // 第1条确认；第2条已确认过或有分析师时确认，否则是推测（35%是错的）
  const real=oppTraits(opp.name),conf=(S.intel&&S.intel[opp.name])||[];
  const r=srng(hstr(intelKey(opp.name)));
  const ord=conf.includes(real[1])&&!conf.includes(real[0])?[real[1],real[0]]:real.slice();
  const out=[{id:ord[0],sure:true,real:true}];
  if(conf.includes(ord[1])||S.player.items.analyst)out.push({id:ord[1],sure:true,real:true});
  else if(r()<0.65)out.push({id:ord[1],sure:false,real:true});
  else{const f=TRAIT_IDS.filter(x=>!real.includes(x));out.push({id:f[Math.floor(r()*f.length)],sure:false,real:false})}
  return out;
}
function intelHtml(list){
  return list.map(x=>`<span class="tag ${x.sure?'ok':'guess'}">${x.sure?'确认':'推测'}<b>${TRAITS[x.id].n}</b></span>`).join('');
}

/* ---- 球衣颜色：本队用队色，对手撞色时自动换开 ---- */
function hexRgb(h){h=String(h||'').replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return null;return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function hslHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function shade(hex,p){const c=hexRgb(hex)||[120,120,120];return '#'+c.map(v=>Math.round(clamp(p<0?v*(1+p):v+(255-v)*p,0,255)).toString(16).padStart(2,'0')).join('')}
function cdist(a,b){const x=hexRgb(a),y=hexRgb(b);return x&&y?Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]):999}
function lum(hex){const c=hexRgb(hex)||[128,128,128];return(c[0]*299+c[1]*587+c[2]*114)/1000}
function teamKit(t){
  let c1=t&&t.c1,c2=t&&t.c2;
  if(!hexRgb(c1)||c1==='#8a8f98'){const h=hstr(t?t.name:'x')%360;c1=hslHex(h,55,46);c2=hslHex(h,55,32)}
  if(!hexRgb(c2)||cdist(c1,c2)<24)c2=shade(c1,-0.28);
  if(cdist(c1,'#3f9a5c')<70){c1=shade(c1,0.55);c2=shade(c1,-0.25)} // 和草地太像就提亮
  return {c1,c2};
}
function matchKits(my,opp){
  const a=teamKit(my);let b=teamKit(opp);
  if(cdist(a.c1,b.c1)<100){
    b=cdist(a.c1,b.c2)>=100?{c1:b.c2,c2:shade(b.c2,-0.28)}:{c1:'#f2f4f7',c2:'#c5ccd5'};
    if(cdist(a.c1,b.c1)<100)b={c1:'#272c35',c2:'#14181e'};
  }
  const gks=['#e8b923','#2bb3a8','#c04fd6','#f07f2f','#9ccc3a'];
  const gk=gks.find(c=>cdist(c,a.c1)>120&&cdist(c,b.c1)>120)||'#e8b923';
  return {me:a,opp:b,gk:{c1:gk,c2:shade(gk,-0.3)}};
}
function KIT(){return(typeof M!=='undefined'&&M&&M.kits)||{me:{c1:'#5f84ad',c2:'#41618c'},opp:{c1:'#b56f63',c2:'#8a4b41'},gk:{c1:'#e8b923',c2:'#a2810f'}}}

/* ---- 赛前小目标（规范第五节） ---- */
const MGOALS={
 precise:{n:'打出一次精准射门',bench:1,avail:()=>M.chances>0,test:e=>e.some(x=>x.game==='shot'&&x.precise)},
 ys_on:{n:'远射打正门框',avail:()=>!!M.seen.edge,test:e=>e.some(x=>x.game==='shot'&&x.situ==='ys'&&x.res!=='miss'&&x.res!=='block')},
 dd_goal:{n:'单刀破门',avail:()=>!!(M.seen.counter||M.seen.edge),test:e=>e.some(x=>x.game==='shot'&&x.situ==='dd'&&x.res==='goal')},
 onetwo:{n:'完成一次二过一',bench:1,avail:()=>!!M.seen.edge,test:e=>e.some(x=>x.act==='e_12'&&x.res==='12')},
 keypass:{n:'送出关键传球或助攻',bench:1,avail:()=>M.chances>0,test:e=>e.some(x=>x.game==='pass'&&(x.res==='akey'||x.res==='agoal'))},
 cross_ok:{n:'传中找到队友',avail:()=>!!M.seen.wing,test:e=>e.some(x=>x.act==='w_cross'&&x.res!=='cut')},
 perfect:{n:'完美时机突破',bench:1,avail:()=>M.chances>0,test:e=>e.some(x=>x.game==='drib'&&x.perfect&&x.res==='win')},
 foul:{n:'突破造任意球',avail:()=>M.chances>0,test:e=>e.some(x=>x.game==='drib'&&x.res==='foul')},
 drib2:{n:'本场突破成功两次',avail:()=>M.chances>=2,test:e=>e.filter(x=>x.game==='drib'&&x.res==='win').length>=2},
};
function goalKey(){return `${S.player.season}|${S.round}|${(S.cupQ||[]).length}`}
function ensureGoals(){
  const k=goalKey();
  if(!S.pendingGoal||S.pendingGoal.key!==k){
    const bench=S.player.trust<30;
    const pool=Object.keys(MGOALS).filter(id=>!bench||MGOALS[id].bench);
    S.pendingGoal={key:k,opts:shuffle(pool).slice(0,3),pick:null};
  }
  return S.pendingGoal;
}
function pickGoal(id){const g=ensureGoals();g.pick=g.pick===id?null:id;save();renderGoals()}
function renderGoals(){
  const el=$('hGoals');if(!el)return;
  if(!S.player||S.player.injury>0||S.round>=S.rounds&&!(S.cupQ&&S.cupQ.length)){el.innerHTML='';return}
  const g=ensureGoals();
  el.innerHTML=`<div class="sub-h">本场小目标<span>选一个，完成训练点 +1；不选也行</span></div><div class="chips">`+
    g.opts.map(id=>`<button class="chip${g.pick===id?' on':''}" onclick="pickGoal('${id}')">${MGOALS[id].n}</button>`).join('')+'</div>';
}

/* ---- 纪念册（规范第六节） ---- */
const ALBUM={debut:'职业首秀',goal:'职业生涯第一球',assist:'第一次助攻',hat:'第一个帽子戏法',winner:'第一次绝杀',
  champ:'第一个冠军',ntdebut:'国家队首秀',ntgoal:'国家队第一球',up:'第一次踢上更高级别联赛',europe:'登陆欧洲',big5:'踢上五大联赛',nemesis:'第一次压过宿敌'};
const ALBUM_BIG=['goal','winner','champ','ntgoal','big5','hat'];
function ensureAlbum(){const p=S.player;if(!p.album)p.album=[];if(!p.albumKeys)p.albumKeys={};if(!p.style)p.style={fin:0,drb:0,ply:0}}
function albumAdd(k,o){
  ensureAlbum();const p=S.player;
  if(p.albumKeys[k])return null;
  p.albumKeys[k]=1;
  p.album.push({k,age:p.age,season:p.season,comp:o.comp||'',opp:o.opp||'',score:o.score||'',min:o.min==null?null:o.min,txt:o.txt||''});
  return ALBUM[k];
}
function albumHonor(){ // 第一个冠军：从荣誉列表里找
  const h=S.player.honors.find(x=>x.includes('冠军'));
  return h?albumAdd('champ',{comp:h,txt:h}):null;
}
function albumMatch(o){
  const got=[],base={comp:M.label,opp:M.opp.name,score:`${M.gT}-${M.gO}`};
  const add=(k,x)=>{const r=albumAdd(k,Object.assign({},base,x||{}));if(r)got.push(r)};
  add('debut',{txt:M.bench?'替补登场':'首发出场'});
  if(M.goals>0){const g=M.goalLog[0];add('goal',{min:g.min,txt:g.how})}
  if(M.assists>0&&M.assistLog.length){const a=M.assistLog[0];add('assist',{min:a.min,txt:a.how})}
  if(M.goals>=3)add('hat',{txt:`单场打进${M.goals}球`});
  if(o.win&&!o.pen){ // 决定性进球：让本队比分超过对手最终比分的那一球
    const mine=M.scoreLog.filter(x=>!x.opp),dec=mine[M.gO];
    if(dec&&dec.me&&dec.min>=85)add('winner',{min:dec.min,txt:dec.how});
  }
  if(M.cup){add('ntdebut',{txt:'代表中国队出场'});if(M.goals>0)add('ntgoal',{min:M.goalLog[0].min,txt:M.goalLog[0].how})}
  return got;
}
function howText(){ // 这次机会是怎么打出来的：局面 + 动作链
  const c=M.ch;if(!c)return '';
  return (SCENES[c.scene]?SCENES[c.scene].n+'，':'')+c.trail.join('，');
}

/* ---- 公共赛后结算：联赛/杯赛/国家队三份结算都调用（规范第七节） ---- */
function postMatchCommon(o){
  if(M.post)return M.post;
  const p=S.player,items=[];let tp=0;
  ensureAlbum();
  albumMatch(o).forEach(t=>items.push({c:'gold',t:`纪念册新增：${t}`}));
  if(M.goal&&MGOALS[M.goal]){
    const mg=MGOALS[M.goal];
    if(mg.test(M.ev)){tp=1;p.tp+=1;items.push({c:'ok',t:`小目标完成：${mg.n}，训练点 +1`})}
    else items.push({c:'dim',t:mg.avail()?`小目标没完成：${mg.n}`:`小目标「${mg.n}」：本场没有对应机会`});
  }
  // 情报：用过的真实特点记下来；推测错了也告诉你
  if(!S.intel)S.intel={};
  const known=S.intel[M.opp.name]||(S.intel[M.opp.name]=[]);
  M.usedTr.forEach(id=>{
    if(!known.includes(id)){known.push(id);
      if(!M.intel.some(x=>x.id===id&&x.sure))items.push({c:'ok',t:`摸清了${M.opp.name}：${TRAITS[id].n}`})}
  });
  M.intel.forEach(x=>{if(!x.real&&M.fakeTried.includes(x.id))items.push({c:'warn',t:`情报有误：${M.opp.name}并没有「${TRAITS[x.id].n}」`})});
  M.ev.forEach(e=>{
    if(e.game==='shot'&&e.precise)p.style.fin++;
    if(e.game==='drib'&&e.perfect&&e.res==='win')p.style.drb++;
    if(e.game==='pass'&&['akey','agoal','12'].includes(e.res))p.style.ply++;
  });
  S.pendingGoal=null;
  const show=items.slice(0,3),more=items.slice(3);
  const row=x=>`<div class="pm ${x.c}"><i></i>${x.t}</div>`;
  const html=items.length?`<div class="pmlist">${show.map(row).join('')}${more.length?`<details><summary>还有 ${more.length} 条</summary>${more.map(row).join('')}</details>`:''}</div>`:'';
  M.post={tp,html};
  return M.post;
}

/* ---- 局面面板 ---- */
function openKey(){
  const w=Object.assign({},SCENE_W[M.tac]||SCENE_W.bal);
  if(M.traits.includes('wing'))w.wing+=15;
  const tot=w.counter+w.edge+w.wing;let r=Math.random()*tot,sc='edge';
  for(const k of ['counter','edge','wing']){if(r<w[k]){sc=k;break}r-=w[k]}
  M.chances++;
  M.ch={scene:sc,node:0,trail:[]};
  log(`${M.min}' 机会：${SCENES[sc].n}`,'k');
  openScene(sc);
}
function availActs(sc){return SCENES[sc].acts.filter(a=>!ACTS[a].cond||ACTS[a].cond())}
function setHint(txt,tone){const h=$('gHint');h.className='hint'+(tone?' '+tone:'');h.innerHTML=txt}
function openScene(sc,lead){
  M.ch.scene=sc;M.seen[sc]=1;
  G={mode:'scene',scene:sc,phase:0,t:0,hl:-1,acts:availActs(sc)};
  $('gTitle').innerHTML=`<span class="gmin">${M.min}'</span>${SCENES[sc].n}`;
  setHint((lead?lead+' ':'')+SCENES[sc].d,'dim');
  $('gBtns').innerHTML='<div class="acts">'+G.acts.map((a,i)=>actCard(a,i)).join('')+'</div>';
  $('overlay').classList.remove('hidden');
  startLoop();
}
function actCard(a,i){
  const A=ACTS[a],p=S.player;
  const fit=M.intel.find(x=>TRAITS[x.id].fit.includes(a)),hurt=M.intel.find(x=>(TRAITS[x.id].hurt||[]).includes(a));
  const pr=A.t==='safe'?0:(M.press[A.t]||0);
  const attr=A.k?`<em>${ATTRS[A.k]} ${p.attrs[A.k]}</em>`:'';
  const tags=(fit?`<i class="fit">${fit.sure?'对方':'可能'}${TRAITS[fit.id].n}</i>`:'')+(hurt?`<i class="bad">${hurt.sure?'对方':'可能'}${TRAITS[hurt.id].n}</i>`:'')+(pr?`<i class="warn">对方已盯防${pr>1?'（加强）':''}</i>`:'');
  return `<button class="act${pr?' pressed':''}${fit?' isfit':''}" onclick="pickAct('${a}')" onpointerenter="if(G)G.hl=${i}" onpointerleave="if(G)G.hl=-1">`+
    `<span class="no">${i+1}</span><span class="body"><b>${A.n}${attr}</b><span>${A.d}</span>${tags?`<span class="tags">${tags}</span>`:''}</span></button>`;
}
function buildMod(a,pr){
  const has=t=>M.traits.includes(t),mod={adj:0,used:[]};
  const use=t=>{if(has(t)){mod.used.push(t);return true}return false};
  switch(a){
    case 'c_drib':mod.game='drib';mod.lspd=0.85;mod.adj=0.05;mod.win={situ:'dd'};break; // 反击空间大
    case 'c_pass':mod.game='pass';mod.kind='through';mod.n=2;mod.goalAdd=0.04;break;
    case 'c_run':mod.game='shot';mod.situ='dd';mod.bspd=1.15;break;
    case 'e_shot':mod.game='shot';mod.situ='ys';mod.reach=0.88;break;  // 转身就打，门将准备不足
    case 'e_12':mod.game='pass';mod.kind='12';mod.n=1;break;
    case 'e_drib':mod.game='drib';mod.energy=2;mod.foul=0.24;mod.win={situ:'qd',reach:0.9};break;
    case 'w_cut':mod.game='drib';mod.win={situ:'ys',spread:0.75,reach:0.85};break; // 内切打远角
    case 'w_cross':mod.game='pass';mod.kind='cross';mod.n=2;break;
    default:mod.game='none';
  }
  if(mod.game==='drib'&&use('slow')){ // 转身慢：更好过，过掉以后他也追不回来，射门更从容
    mod.lspd=(mod.lspd||1)*0.85;mod.thr=-0.05;mod.win=Object.assign({},mod.win,{reach:(mod.win.reach||1)*0.82})}
  if((a==='c_pass'||a==='e_12')&&use('press')){mod.cutMul=0.75;if(a==='e_12')mod.adj+=0.05;else mod.goalAdd=(mod.goalAdd||0)+0.05} // 上抢：身后有空当
  if(mod.game==='drib'&&use('press'))mod.foul=(mod.foul||0.18)+0.06;
  if(['w_cut','e_12','e_drib'].includes(a)&&use('narrow'))mod.adj-=0.06;
  if(a==='w_cross'){if(use('narrow'))mod.goalAdd=(mod.goalAdd||0)+0.08;if(use('wing'))mod.goalAdd=(mod.goalAdd||0)+0.07}
  mod.adj=clamp(mod.adj,-0.12,0.12)-0.08*pr;            // 特点修正封顶±0.12，盯防另算，最多-0.16
  mod.goalAdd=clamp(mod.goalAdd||0,-0.12,0.12)-0.04*pr; // 被盯防的传球：就算传到，队友也更难打进
  return mod;
}
function pickAct(a){
  if(!G||G.mode!=='scene'||!G.acts.includes(a))return;
  const A=ACTS[a],pr=A.t==='safe'?0:(M.press[A.t]||0);
  // 同场针对：同一类动作连续用两次，对方开始盯防；换别的一次，降一档
  if(M.lastT===A.t)M.run++;
  else{M.run=1;for(const k in M.press)if(k!==A.t&&M.press[k]>0)M.press[k]--}
  M.lastT=A.t;
  if(A.t!=='safe'&&M.run>=2){const nv=Math.min(2,M.run-1);
    if(nv>(M.press[A.t]||0)){M.press[A.t]=nv;M.pressLog=`${M.min}' 对方开始${nv>1?'加强':'重点'}盯防你的${ACT_TYPE[A.t]}。`}}
  const fake=M.intel.find(x=>!x.real&&TRAITS[x.id].fit.includes(a));
  if(fake&&!M.fakeTried.includes(fake.id))M.fakeTried.push(fake.id);
  const mod=buildMod(a,pr);
  mod.used.forEach(t=>{if(!M.usedTr.includes(t))M.usedTr.push(t)});
  M.extraE+=mod.energy||0;
  M.ch.act=a;M.ch.node++;M.ch.trail.push(A.n);
  G=null;
  if(mod.game==='drib')openDribble(mod);
  else if(mod.game==='pass')openPass(mod);
  else if(mod.game==='shot')openShot(SITU_BY(mod.situ),mod);
  else resolveBack();
}
function resolveBack(){
  const ok=Math.random()<0.65;
  M.ev.push({scene:M.ch.scene,act:'w_back',game:'none',res:ok?'keep':'clear',min:M.min});
  if(ok){log(`${M.min}' 你把球回做给中场，球权还在。`,'d');openScene('edge','球又回到你脚下。')}
  else{log(`${M.min}' 你回做，对方前锋伸脚把球捅出了边线。`,'d');closeKey()}
}
function closeKey(){
  G=null;$('overlay').classList.add('hidden');
  if(M.pressLog){log(M.pressLog,'y');M.pressLog=null}
  runTimer();
}
function chainNext(){ // 节点上限：一次机会最多3个节点；到顶返回false
  if(!M.ch)return true;
  if(M.ch.node>=3)return false;
  M.ch.node++;return true;
}
function pushEv(o){if(M&&M.ev)M.ev.push(Object.assign({scene:M.ch&&M.ch.scene,act:M.ch&&M.ch.act,min:M.min},o))}

/* ---- 局面示意图：几个人、几条箭头，箭头编号对应下面的动作卡片 ---- */
const SCENE_POS={
 counter:{me:{x:240,y:262},mates:[{x:116,y:178},{x:368,y:168}],def:[{x:190,y:122},{x:302,y:110}],
   arrows:{c_drib:[[240,262],[262,176],[236,58]],c_pass:[[240,262],[306,214],[366,180]],c_run:[[240,262],[226,160],[240,48]]}},
 edge:{me:{x:240,y:136},mates:[{x:340,y:176},{x:140,y:200}],def:[{x:240,y:100},{x:330,y:124}],
   arrows:{e_shot:[[240,136],[238,80],[232,16]],e_12:[[240,136],[296,168],[336,176],[304,96],[262,56]],e_drib:[[240,136],[312,148],[360,96]]}},
 wing:{me:{x:70,y:236},mates:[{x:214,y:68},{x:324,y:90},{x:184,y:266}],def:[{x:106,y:190},{x:258,y:96}],
   arrows:{w_cut:[[70,236],[124,206],[176,130]],w_cross:[[70,236],[118,96],[214,72]],w_back:[[70,236],[122,262],[176,264]]}},
};
function pitchTop(){ // 进攻方向朝上的半场：草皮、禁区、球门
  const gr=ctx.createLinearGradient(0,0,0,330);
  gr.addColorStop(0,'#47a868');gr.addColorStop(1,'#2e8a4e');
  ctx.fillStyle=gr;ctx.fillRect(0,0,480,330);
  for(let i=0;i<8;i++){if(i%2){ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(0,i*42,480,42)}}
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
  ctx.strokeRect(110,-2,260,80);ctx.strokeRect(178,-2,124,36);
  ctx.beginPath();ctx.arc(240,78,32,0,Math.PI);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(240,56,2.2,0,7);ctx.fill();
  // 球门：门柱有厚度，网格有深浅
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(188,0,104,16);
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;
  for(let x=196;x<292;x+=8){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,16);ctx.stroke()}
  for(let y=4;y<16;y+=6){ctx.beginPath();ctx.moveTo(188,y);ctx.lineTo(292,y);ctx.stroke()}
  ctx.fillStyle='#fff';ctx.fillRect(184,0,4,18);ctx.fillRect(292,0,4,18);ctx.fillRect(184,15,112,3);
}
function arrowPath(pts,col,w,dash,t){
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  if(dash){ctx.setLineDash([7,6]);ctx.lineDashOffset=-t*0.6}
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  if(pts.length===3)ctx.quadraticCurveTo(pts[1][0],pts[1][1],pts[2][0],pts[2][1]);
  else for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();ctx.setLineDash([]);
  const a=pts[pts.length-1],b=pts[pts.length-2],ang=Math.atan2(a[1]-b[1],a[0]-b[0]);
  ctx.translate(a[0],a[1]);ctx.rotate(ang);
  ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(-8,-6);ctx.lineTo(-8,6);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawScene(){
  const k=KIT(),pos=SCENE_POS[G.scene];
  ctx.clearRect(0,0,480,330);pitchTop();
  drawMini(240+10*Math.sin(G.t*0.03),30,k.gk.c1,k.gk.c2,'#1b2230',G.t*0.05,0.72);
  // 箭头：编号和卡片一致；适合对手特点的绿色，被盯防的红色虚线
  G.acts.forEach((a,i)=>{
    const pts=pos.arrows[a];if(!pts)return;
    const hl=G.hl===i,pr=(M.press[ACTS[a].t]||0)>0,fit=M.intel.some(x=>TRAITS[x.id].fit.includes(a));
    const col=pr?'rgba(255,170,160,'+(hl?1:.8)+')':fit?'rgba(176,255,204,'+(hl?1:.85)+')':'rgba(255,255,255,'+(hl?1:.7)+')';
    arrowPath(pts,col,hl?3.5:2.5,ACTS[a].t==='pass'||pr,G.t);
    const e=pts[pts.length-1],lx=e[0]+(e[0]<240?-14:14),ly=e[1]+(e[1]<40?14:-2);
    ctx.fillStyle=hl?'#fff':'rgba(16,24,32,.78)';ctx.fillRect(lx-9,ly-9,18,18);
    ctx.fillStyle=hl?'#111':'#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(i+1),lx,ly+0.5);ctx.textBaseline='alphabetic';
  });
  pos.def.forEach((d,i)=>drawMini(d.x+4*Math.sin(G.t*0.06+i),d.y,k.opp.c1,k.opp.c2,shade(k.opp.c2,-0.45),G.t*0.1+i,0.82));
  pos.mates.forEach((m,i)=>drawMini(m.x,m.y,k.me.c1,k.me.c2,shade(k.me.c2,-0.45),G.t*0.14+i*1.7,0.82));
  // 你：脚下光圈 + 球
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(pos.me.x,pos.me.y+27,18,6,0,0,7);ctx.stroke();
  drawMini(pos.me.x,pos.me.y,k.me.c1,k.me.c2,shade(k.me.c2,-0.45),Math.sin(G.t*0.05),0.95);
  drawBall2(pos.me.x+11,pos.me.y+24,5.5);
  namePill(pos.me.x,pos.me.y-36,'你',true);
}
