<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一球成名">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>一球成名 · 足球人生</title>
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --card2:#f0f3f6; --line:#d9dee5;
  --txt:#1b2230; --dim:#5d6875; --green:#1f9d55; --green2:#17813f;
  --gold:#b7860b; --red:#c9463c; --blue:#2c6fb7; --ink:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:linear-gradient(180deg,#e6f3ea 0,var(--bg) 260px) fixed;color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;border-bottom:3px solid var(--green);position:sticky;top:0;background:#fff;z-index:5}
header h1{font-size:18px;letter-spacing:1px}
header h1 span{color:var(--green)}
#hdInfo{color:var(--dim);font-size:13px}
main{max-width:760px;margin:0 auto;padding:18px 14px calc(60px + env(safe-area-inset-bottom))}
section{display:none}
section.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(20,40,30,.06)}
.crest{display:inline-flex;align-items:center;justify-content:center;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);color:#fff;font-weight:800;vertical-align:-3px;margin-right:6px;text-shadow:0 1px 2px rgba(0,0,0,.45);flex:none}
img.crest{clip-path:none;object-fit:contain;text-shadow:none;background:transparent}
.flag{display:inline-block;margin-right:5px;vertical-align:-1px;line-height:1}
.card h2{font-size:14px;margin-bottom:12px;color:var(--dim);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.btn{display:inline-block;background:var(--green);color:#fff;border:none;border-radius:0;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;letter-spacing:.5px}
.btn:hover{background:var(--green2)}
.btn:disabled{background:#cfd5dc;color:#8a939d;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--card2);border-color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input[type=text]{background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:0;padding:11px 14px;font-size:16px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--green)}
/* player card */
.pcard{display:flex;gap:16px;align-items:center}
.ovr{width:74px;height:74px;border-radius:0;background:linear-gradient(135deg,#1f9d55,#17813f);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ovr b{font-size:28px;color:#fff}
.ovr span{font-size:11px;color:rgba(255,255,255,.8)}
.pinfo b{font-size:19px}
.pinfo .sub{color:var(--dim);font-size:13px;margin-top:4px;line-height:1.6}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-top:6px}
.attr{display:flex;align-items:center;gap:8px;font-size:13px}
.attr .nm{width:34px;color:var(--dim)}
.attr .bar{flex:1;height:7px;background:#e3e8ee;border-radius:0;overflow:hidden}
.attr .bar i{display:block;height:100%;background:var(--green);border-radius:0}
.attr .vl{width:24px;text-align:right;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;background:var(--card2)}
td.nm,th.nm{text-align:left}
tr.me td{color:var(--green2);font-weight:700;background:#eaf7ef}
/* match */
#board{display:flex;justify-content:center;align-items:center;gap:18px;font-size:20px;font-weight:800;padding:6px 0}
#board .mn{font-size:13px;color:#fff;background:var(--gold);border-radius:0;padding:3px 10px;font-weight:700}
#mlog{height:300px;overflow-y:auto;font-size:13.5px;line-height:1.9;padding:4px 2px}
#mlog p{padding:1px 6px;border-radius:0}
#mlog p.g{color:var(--green2);font-weight:700;background:#eaf7ef}
#mlog p.b{color:var(--red)}
#mlog p.y{color:var(--gold)}
#mlog p.d{color:var(--dim)}
/* overlay minigame */
#overlay{position:fixed;inset:0;background:rgba(18,28,36,.6);display:flex;align-items:center;justify-content:center;z-index:20}
#overlay.hidden{display:none}
.gamebox{background:var(--card);border:1px solid var(--line);border-radius:0;padding:16px;text-align:center;max-width:96vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.gamebox h3{margin-bottom:4px;font-size:17px}
.gamebox .hint{color:var(--gold);font-size:13px;margin-bottom:10px;min-height:18px}
#cv{background:#3a9a5c;border-radius:0;cursor:crosshair;max-width:100%;touch-action:none;-webkit-touch-callout:none}
#gBtns{margin-top:10px;min-height:44px}
/* result */
.big{font-size:34px;font-weight:800;text-align:center;padding:8px 0}
.rate{text-align:center;margin:6px 0 12px}
.rate b{font-size:42px;color:var(--green)}
.rate.bad b{color:var(--red)}
.rate span{color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat{background:var(--card2);border-radius:0;padding:10px 4px;border-left:3px solid var(--green)}
.stat b{font-size:20px;display:block}
.stat span{font-size:12px;color:var(--dim)}
.tnote{color:var(--gold);font-size:13px;text-align:center;margin-top:10px}
/* training */
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border:none}
.trow .nm{width:44px}
.trow .bar{flex:1;height:9px;background:#e3e8ee;border-radius:0;overflow:hidden}
.trow .bar i{display:block;height:100%;background:var(--blue);border-radius:0}
.trow .vl{width:28px;text-align:right;font-weight:800;font-size:16px}
.trow .cost{width:52px;color:var(--dim);font-size:12px;text-align:right}
.plus{width:36px;height:36px;border-radius:0;border:none;background:var(--green);color:#fff;font-size:20px;font-weight:800;cursor:pointer}
.plus:disabled{background:#cfd5dc;color:#8a939d;cursor:not-allowed}
#tpLeft{color:var(--gold);font-weight:800}
.center{text-align:center}
.mt{margin-top:12px}
.honor{color:var(--gold)}
/* 事件弹窗 */
#evOverlay{position:fixed;inset:0;background:rgba(18,28,36,.6);display:flex;align-items:center;justify-content:center;z-index:30}
#evOverlay.hidden{display:none}
.evcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:0;padding:22px;max-width:420px;width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto}
.evcard h3{font-size:17px;margin-bottom:10px}
.evcard .txt{color:var(--txt);font-size:14px;line-height:1.8;margin-bottom:16px;min-height:40px}
.evbtn{display:block;width:100%;text-align:left;background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:0;padding:12px 14px;font-size:14px;cursor:pointer;margin-top:8px;transition:.15s}
.evbtn:hover{background:var(--card2);border-color:var(--green)}
/* 生活商店 */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border:none}
.lrow .info{flex:1}
.lrow .info b{font-size:15px}
.lrow .info span{display:block;color:var(--dim);font-size:12.5px;margin-top:3px}
.stats>p{grid-column:1/-1;text-align:center}
.box2{background:var(--card2);border-left:3px solid var(--green);padding:10px 12px;margin-top:8px}
/* 手机适配 */
@media (max-width:520px){
  main{padding:12px 8px calc(44px + env(safe-area-inset-bottom))}
  header{padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
  header h1{font-size:15px}
  #hdInfo{font-size:10.5px;text-align:right}
  .card{padding:12px;margin-bottom:10px}
  table{font-size:11.5px}
  th,td{padding:5px 3px}
  .stats{grid-template-columns:repeat(2,1fr)}
  #mlog{height:44vh}
  #board{font-size:15px;gap:8px;flex-wrap:wrap}
  .btn{padding:12px 16px;font-size:14px}
  .row{gap:8px}
  .row .btn{flex:1;min-width:100px}
  .pcard{gap:12px}
  .ovr{width:62px;height:62px}
  .ovr b{font-size:24px}
  .pinfo b{font-size:17px}
  .pinfo .sub{font-size:12px}
  .attrs{gap:6px 12px}
  .big{font-size:28px}
  .gamebox{padding:10px}
  .gamebox h3{font-size:15px}
  #hBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #hBtns .btn{min-width:0;padding:12px 8px}
  #rSeason p{font-size:14px;line-height:1.85}
  .evcard{padding:16px}
}
</style>
</head>
<body>
<header><h1>⚽ 一球成名<span>·</span>足球人生</h1><div id="hdInfo"></div></header>
<main>

<!-- 开始 -->
<section id="scStart" class="on">
  <div class="card center" style="margin-top:40px;padding:36px 20px">
    <div style="font-size:44px">⚽</div>
    <h2 style="color:var(--txt);font-size:22px;margin:10px 0 6px">开启你的足球人生</h2>
    <p style="color:var(--dim);font-size:14px;margin-bottom:22px">17岁青训前锋，从中乙联赛出发，踢进中超、登陆五大联赛、披上国家队战袍，直到金球奖。</p>
    <div style="max-width:300px;margin:0 auto">
      <input type="text" id="inName" placeholder="输入球员姓名" value="李风" maxlength="10">
      <button class="btn mt" style="width:100%" onclick="newGame()">开始生涯</button>
      <button class="btn ghost mt" style="width:100%;display:none" id="btnLoad" onclick="loadGame()">继续上次生涯</button>
      <button class="btn ghost mt" style="width:100%" onclick="openSlots('load')">📂 读取存档</button>
    </div>
  </div>
</section>

<!-- 主页 -->
<section id="scHome">
  <div class="row" id="saveBar" style="margin-bottom:10px;gap:6px">
    <button class="btn ghost grow" style="padding:8px 6px;font-size:13px" onclick="openSlots('save')">💾 存档</button>
    <button class="btn ghost grow" style="padding:8px 6px;font-size:13px" onclick="openSlots('load')">📂 读档</button>
    <button class="btn ghost grow" style="padding:8px 6px;font-size:13px" onclick="confirmNew()">🆕 新开</button>
  </div>
  <div class="card">
    <div class="pcard">
      <div class="ovr"><b id="hOvr"></b><span>综合</span></div>
      <div class="pinfo grow">
        <b id="hName"></b>
        <div class="sub" id="hSub"></div>
      </div>
    </div>
    <div class="attrs" id="hAttrs"></div>
  </div>
  <div class="card">
    <h2>下一场比赛</h2>
    <div id="hNext" style="font-size:14.5px;line-height:1.85"></div>
    <div id="hTactic" style="margin-top:10px"></div>
    <div class="row" id="hBtns" style="margin-top:14px">
      <button class="btn grow" id="btnKick" onclick="startMatch()">开始比赛</button>
      <button class="btn ghost grow" onclick="showTrain()">训练 <span id="hTp"></span></button>
      <button class="btn ghost grow" onclick="showLife()">生活 💰</button>
      <button class="btn ghost grow" onclick="showStats()">档案 📋</button>
    </div>
  </div>
  <div class="card">
    <h2>联赛积分榜 · 第<span id="hSeason"></span>赛季</h2>
    <div id="hTable"></div>
  </div>
</section>

<!-- 训练 -->
<section id="scTrain">
  <div class="card">
    <h2>训练中心 — 可用训练点：<span id="tpLeft"></span></h2>
    <div id="tRows"></div>
    <p style="color:var(--dim);font-size:12px;margin-top:10px">属性越高提升越贵：60以下1点 / 75以下2点 / 90以下3点，上限95。训练点靠比赛表现赚取。<br>每练1点消耗8精力——练得太狠，比赛就会脚软。精力每周自然恢复。</p>
    <div class="center mt"><button class="btn" onclick="goHome()">完成训练，返回</button></div>
  </div>
</section>

<!-- 比赛 -->
<section id="scMatch">
  <div class="card">
    <div id="board"><span id="bHome"></span><span id="bScore">0 - 0</span><span id="bAway"></span><span class="mn" id="bMin">0'</span></div>
  </div>
  <div class="card"><div id="mlog"></div></div>
</section>

<!-- 赛后 -->
<section id="scResult">
  <div class="card">
    <div class="big" id="rScore"></div>
    <div class="center" style="color:var(--dim)" id="rVs"></div>
    <div class="rate" id="rRateBox"><b id="rRate"></b><span> 本场评分</span></div>
    <div class="stats">
      <div class="stat"><b id="rGoals"></b><span>进球</span></div>
      <div class="stat"><b id="rAssists"></b><span>助攻</span></div>
      <div class="stat"><b id="rShots"></b><span id="lb3">射门</span></div>
      <div class="stat"><b id="rTp"></b><span id="lb4">获得训练点</span></div>
    </div>
    <div class="tnote" id="rNote"></div>
    <div id="rSeason"></div>
    <div class="center mt">
      <button class="btn" id="rBtn" onclick="afterResult()">继续</button>
    </div>
  </div>
</section>
<!-- 生活 -->
<section id="scLife">
  <div class="card">
    <h2>生活 — 存款 <span id="lfMoney" style="color:var(--gold)"></span> · 周薪 <span id="lfWage" style="color:var(--gold)"></span> · ⭐人气 <span id="lfPop" style="color:var(--green)"></span></h2>
    <div id="lfSponsor" style="color:var(--dim);font-size:13px;margin-bottom:4px"></div>
    <div id="lfItems"></div>
    <div class="center mt"><button class="btn" onclick="goHome()">返回</button></div>
  </div>
</section>

<!-- 生涯档案 -->
<section id="scStats">
  <div class="card">
    <h2>📋 生涯档案</h2>
    <div id="stBody"></div>
    <div class="center mt"><button class="btn" onclick="goHome()">返回</button></div>
  </div>
</section>
</main>

<!-- 事件弹窗 -->
<div id="evOverlay" class="hidden">
  <div class="evcard">
    <h3 id="evTitle"></h3>
    <div class="txt" id="evText"></div>
    <div id="evBtns"></div>
  </div>
</div>

<!-- 小游戏 -->
<div id="overlay" class="hidden">
  <div class="gamebox">
    <h3 id="gTitle"></h3>
    <div class="hint" id="gHint"></div>
    <canvas id="cv" width="480" height="330"></canvas>
    <div id="gBtns"></div>
  </div>
</div>

}
function slotLine(info){return info?`<b>${info.name}</b> · 第${info.season}季 ${info.age}岁 · ${info.team||''}（${info.lg}）· 综合${info.ovr}<br><span style="color:var(--dim);font-size:12px">${info.time||'—'}</span>`:'<span style="color:var(--dim)">— 空 —</span>'}
function openSlots(mode){

    return info?`<button class="evbtn" onclick="loadSlot('${k}')">📂 存档 ${i+1}：${slotLine(info)}</button>`:`<div class="evbtn" style="opacity:.5;cursor:default">存档 ${i+1}：${slotLine(null)}</div>`}).join('');

}

/* ============ 新游戏 ============ */
const clubOf=c=>({name:c.n,c1:c.c1,c2:c.c2,str:c.s,p:c.p||[]}); // 数据表条目→球队对象
function makeTeams(lg,club){ // 组建联赛：真实球队+真实实力（±1波动）；若我方球队不属于该联赛（升级/迁移），则挤掉最弱的一队
  const all=LEAGUES[lg].teams;
  let others=all.filter(o=>o.n!==club.name);
  if(others.length===all.length)others=others.slice().sort((a,b)=>b.s-a.s).slice(0,all.length-1);
  return [club,...shuffle(others).map(o=>({name:o.n,c1:o.c1,c2:o.c2,p:o.p||[],str:clamp(o.s+ri(-1,1),40,99)}))];
}
function badge(t,s){ // 真实队徽（CRESTS）→ 国家队旗帜 → 文字徽章兜底
  s=s||18;
  if(t.f)return `<span class="flag" style="font-size:${Math.round(s*1.05)}px">${t.f}</span>`;
  const img=CRESTS[t.name];
  if(img)return `<img class="crest" src="${img}" alt="" style="width:${Math.round(s*1.15)}px;height:${Math.round(s*1.15)}px">`;
  let c1=t.c1,c2=t.c2;
  if(!c1||c1==='#8a8f98'){let h=0;for(const ch of t.name)h=(h*31+ch.charCodeAt(0))%360;c1=`hsl(${h},48%,46%)`;c2=`hsl(${h},48%,30%)`}
  return `<span class="crest" style="width:${s}px;height:${Math.round(s*1.18)}px;font-size:${Math.round(s*0.56)}px;background:linear-gradient(160deg,${c1},${c2})">${t.ab||t.name[0]}</span>`;
}
function makeSchedule(){
  const n=S.teams.length-1;
  const ord=shuffle(Array.from({length:n},(_,i)=>i+1));
  const sch=[];
  for(let r=0;r<n*2;r++)sch.push({opp:ord[r%n],home:r<n});
  return sch;
}
function rollSquad(newTeam){ // 入队/换季时刷新队友与主教练：真实队友优先，不足从联赛球员池补齐
  const own=S.teams[0].p||[];
  const pool=shuffle(LG().mates.filter(n=>!own.includes(n)&&n!==S.player.name));
  S.mates=[...own,...pool].slice(0,5);
  S.coach=rnd(LG().coaches);
  S.chem=newTeam?35:clamp((S.chem||40)-5,35,100); // 换季默契小降，转会大重置
}
function genRivals(){ // 射手榜竞争对手：来自本联赛其他真实球队的球员
  const cand=[];
  S.teams.slice(1).forEach(t=>(t.p||[]).forEach(n=>cand.push({n,team:t.name,str:t.str})));
  const seen=new Set(cand.map(c=>c.n));
  LG().mates.filter(n=>!S.mates.includes(n)&&!seen.has(n)).forEach(n=>{const t=rnd(S.teams.slice(1));cand.push({n,team:t.name,str:t.str})});
  S.rivals=shuffle(cand).slice(0,5).map(c=>({n:c.n,team:c.team,g:0,rate:0.4+Math.random()*0.35+(c.str-LG().base)*0.008}));
}
function genTask(){ // 教练军令状
  const rank=S.teams.map(t=>t.str).sort((a,b)=>b-a).indexOf(S.teams[0].str)+1;
  S.task={rank:Math.max(1,rank-2),goals:Math.round(6+overall()*0.15)};
}
function newSeasonComps(){ // 杯赛与状态初始化
  S.cupQ=[];S.fa={alive:true,stage:0};
  S.aclActive=!!S.aclNext&&!!LG().cont;S.aclNext=false;
  S.aclGroup=S.aclActive?{idx:0,pts:0,rec:[],
    opps:shuffle(contPool()).slice(0,3).map(o=>({name:o.n,str:o.s,c1:o.c1,c2:o.c2}))}:null;
  S.player.form=50;
  genRivals();genTask();
}
function freshTable(){return S.teams.map((t,i)=>({i,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0}))}

function train(k){
  const p=S.player,c=costOf(p.attrs[k]);
  if(p.tp>=c&&p.attrs[k]<95&&p.energy>=8){p.tp-=c;p.energy-=8;p.attrs[k]++;

  showTrain();
}

/* ============ 伤停轮次 ============ */
function skipInjured(){
  const p=S.player;
  p.injury--;
  p.energy=clamp(p.energy+18,0,100);
  let txt='';
  if(S.cupQ&&S.cupQ.length){ // 杯赛只能看队友踢
    const q=S.cupQ.shift();
    const win=Math.random()<0.45;
    if(q.comp==='nt'){txt=`${ntWindowName()}：你因伤退出国家队集训，中国队${win?'赢了':'没能取胜'}。`}
    else if(q.comp==='fa'){
      if(win){S.fa.stage++;if(S.fa.stage>4)S.fa.alive=false;txt=`${faName()}：队友们顶住了，晋级！`}
      else{S.fa.alive=false;txt=`${faName()}：没有你的球队遗憾出局……`}
    }else{
      const g=S.aclGroup;g.pts+=win?3:0;g.rec.push(win?'胜(伤缺)':'负(伤缺)');g.idx++;
      txt=`${contName()}小组赛：你在看台上看完了全场，球队${win?'赢了':'输了'}。`;
    }
  }else if(S.round<S.rounds){
    const fx=S.schedule[S.round];
    const o=S.teams[fx.opp];
    const gA=pois(clamp(1.1+(S.teams[0].str-o.str)*0.04,0.2,2.4)),gB=pois(clamp(1.3+(o.str-S.teams[0].str)*0.04,0.2,2.6));
    addResult(0,gA,fx.opp,gB);
    const rest=shuffle(Array.from({length:S.teams.length-1},(_,i)=>i+1).filter(i=>i!==fx.opp));
    for(let i=0;i<rest.length-1;i+=2){
      const a=rest[i],b=rest[i+1];
      addResult(a,pois(clamp(1.3+(S.teams[a].str-S.teams[b].str)*0.04,0.2,2.6)),
                b,pois(clamp(1.3+(S.teams[b].str-S.teams[a].str)*0.04,0.2,2.6)));
    }
    S.round++;
    if(S.rivals)S.rivals.forEach(r=>r.g+=pois(r.rate));
    // 伤停期间杯赛照常排期
    if(S.fa&&S.fa.alive&&S.fa.stage<=4&&faAfter().includes(S.round))S.cupQ.push({comp:'fa'});
    if(S.aclActive&&S.aclGroup&&S.aclGroup.idx<3&&aclAfter().includes(S.round))S.cupQ.push({comp:'acl'});
    txt=`联赛第${S.round}轮：你伤停缺席，球队 ${gA}:${gB} ${gA>gB?'获胜':gA===gB?'战平':'落败'}。`;
  }
  const over=S.round>=S.rounds&&!(S.cupQ&&S.cupQ.length);
  if(over)p.injury=0; // 赛季末强制复出
  $('evTitle').textContent='🏥 伤停恢复中';
  $('evText').innerHTML=`${txt}<br>队医：「${p.injury>0?`还需休养 ${p.injury} 轮。`:'下一场你可以复出了！'}」`;

/* ============ 比赛 ============ */
function log(txt,cls){const el=document.createElement('p');if(cls)el.className=cls;el.textContent=txt;$('mlog').appendChild(el);$('mlog').scrollTop=99999}
const CN_NT={name:'中国',f:'🇨🇳'};
function ntStr(){return clamp(72+(overall()-70)*0.5,68,90)}
function startMatch(){ // 联赛/杯赛入口
  if(S.player.injury>0){skipInjured();return}
  if(S.cupQ&&S.cupQ.length){beginClubCup(S.cupQ[0]);return}
  const fx=S.schedule[S.round];
  beginMatch({opp:S.teams[fx.opp],oppIdx:fx.opp,home:fx.home,cup:null});
}
function beginClubCup(q){
  let opp;
  if(q.comp==='fa'){ // 抽签：本国各级联赛，越到后面对手越强
    const st=S.fa.stage,l=LG();
    const lgs=Object.values(LEAGUES).filter(x=>x.country===l.country).sort((a,b)=>b.level-a.level); // 低级→高级
    let pick=st<=0?lgs.filter(x=>x.level>=l.level):st<=2?lgs:lgs.filter(x=>x.level<=Math.max(1,l.level));
    if(st>=3)pick=lgs.filter(x=>x.level===1);
    const lgx=rnd(pick.length?pick:lgs);
    const cand=lgx.teams.filter(x=>x.n!==S.teams[0].name);
    const o=st>=3?rnd(cand.slice().sort((a,b)=>b.s-a.s).slice(0,6)):rnd(cand);
    opp={name:o.n,c1:o.c1,c2:o.c2,str:o.s+ri(-2,2)};
  }else if(q.comp==='nt'){ // 国家队：国际比赛日
    beginMatch({opp:q.opp,home:q.home,cup:'ntm'});return;
  }else opp=S.aclGroup.opps[S.aclGroup.idx];
  beginMatch({opp,home:Math.random()<0.5,cup:null,club:q.comp});
}
function beginMatch(cfg){
  const opp=cfg.opp,A=S.player.attrs,p=S.player;
  const myStr=cfg.cup?ntStr():S.teams[0].str+(overall()-55)*0.35+((cfg.home||p.items.jet)?2:0);
  const tac=cfg.cup?'bal':(S.tactic||'bal');
  const tAdj=tac==='atk'?[0.3,0.28]:tac==='def'?[-0.22,-0.42]:[0,0];
  const lamT=clamp(1.15+(myStr-opp.str)*0.045+tAdj[0],0.15,2.6);
  const lamO=clamp(1.15+(opp.str-myStr)*0.045+tAdj[1],0.15,2.6);
  const eF=clamp(p.energy/100,0.4,1);
  M={fx:{home:cfg.home,opp:cfg.oppIdx},opp,cup:cfg.cup,club:cfg.club||null,min:0,gT:0,gO:0,goals:0,assists:0,shots:0,saved:0,missed:0,keyp:0,badpass:0,evs:[],ei:0,timer:null,
     gk:Math.round(opp.str+Math.random()*8-3),
     fb:p.form>=75?3:p.form<=25?-3:0, // 状态热度：属性临时±3
     bench:cfg.cup?false:p.trust<30,
     dFac:1.2-0.2*eF,    // 精力低→散布大
     bFac:1.12-0.12*eF}; // 精力低→滑块快
  const usedMin=new Set();
  const pickMin=lo=>{let m;do{m=lo+Math.floor(Math.random()*(88-lo))}while(usedMin.has(m));usedMin.add(m);return m};
  for(let i=0;i<pois(lamT*0.55);i++)M.evs.push({min:pickMin(4),t:'tg'});
  for(let i=0;i<pois(lamO);i++)M.evs.push({min:pickMin(4),t:'og'});
  let nK=M.bench?2:3+((A.dri+A.pac>=130)?1:0)+(Math.random()<0.45?1:0)+(p.trust>=70?1:0)-(eF<0.7?1:0)+(p.items.analyst?1:0)+(tac==='atk'?1:0);
  nK=Math.max(1,nK);
  M.tac=tac; // 防反：反击单刀概率更高（openKey中使用）
  for(let i=0;i<nK;i++)M.evs.push({min:pickMin(M.bench?58:4),t:'key'});
  for(let m=8;m<90;m+=9+Math.floor(Math.random()*5))if(!usedMin.has(m))M.evs.push({min:m,t:'fl'});
  M.evs.sort((a,b)=>a.min-b.min);
  $('mlog').innerHTML='';
  const my=cfg.cup?CN_NT:S.teams[0];
  const bh=cfg.home?my:opp, ba=cfg.home?opp:my;
  $('bHome').innerHTML=badge(bh,20)+bh.name;
  $('bAway').innerHTML=badge(ba,20)+ba.name;
  updBoard();
  const cm=shuffle(COMMS);
  log(`本场解说：${cm[0]}、${cm[1]}`,'d');
  if(cfg.cup==='ntm')log(`${ntWindowName()}：中国队对阵 ${opp.name}（实力${opp.str}）！`,'y');
  else if(cfg.cup)log(`${NT[cfg.cup].name}${S.cup.ko>=0?KO_NAMES[S.cup.ko]:'小组赛第'+(S.cup.idx+1)+'场'}：中国队对阵 ${opp.name}（实力${opp.str}）！`,'y');
  else if(cfg.club==='fa')log(`${faName()}${FA_STAGES[S.fa.stage]}：对阵 ${opp.name}（实力${opp.str}）——单场定胜负！`,'y');
  else if(cfg.club==='acl')log(`${contName()}小组赛第${S.aclGroup.idx+1}场：对阵 ${opp.name}（实力${opp.str}）！`,'y');
  else log(`比赛开始！${cfg.home?'主':'客'}场对阵 ${opp.name}（实力${opp.str} · 门将评分${M.gk}）`,'d');
  if(M.fb>0)log('你最近状态火热，脚感发烫！（属性+3）','g');
  if(M.fb<0)log('近期低迷的状态让你有些犹豫……（属性-3）','b');
  if(M.bench)log(`${S.coach}指导把你按在了替补席上……用登场后的表现赢回信任吧。`,'b');
  if(p.energy<50)log('连日苦练让你双腿发沉，今天状态不佳。','y');
  show('scMatch');

}
function updBoard(){
  const h=M.fx.home;
  $('bScore').textContent=h?`${M.gT} - ${M.gO}`:`${M.gO} - ${M.gT}`;
  $('bMin').textContent=M.min+"'";
}
function runTimer(){
  M.timer=setInterval(()=>{
    M.min++;updBoard();
    while(M.ei<M.evs.length&&M.evs[M.ei].min<=M.min){
      const e=M.evs[M.ei++];
      if(e.t==='key'){clearInterval(M.timer);M.timer=null;openKey();return}
      handleEvent(e);
    }
    if(M.min>=90){clearInterval(M.timer);M.timer=null;endMatch()}
  },75);
}
function handleEvent(e){
  const A=S.player.attrs;
  if(e.t==='tg'){
    M.gT++;updBoard();
    if(Math.random()<A.pas/140+(S.chem-40)/300){M.assists++;log(`${M.min}' 你送出致命直塞，${rnd(S.mates)}冷静推射破门！（助攻+1）`,'g')}
    else log(`${M.min}' ${rnd(S.mates)}为球队破门得分！`,'g');
  }else if(e.t==='og'){
    M.gO++;updBoard();
    log(`${M.min}' 糟糕！${M.opp.name}打进一球。`,'b');
  }else log(`${M.min}' ${rnd(FLAVOR)}。`,'d');
}

/* ============ 射门小游戏（瞄准+时机） ============ */
const cv=$('cv'),ctx=cv.getContext('2d');
const GOAL={x1:72,x2:408,y1:72,y2:250};
/* 能力→小游戏难度的统一曲线：属性40→0，100→1
   能力弱：滑块/防守人动得快、甜区小；能力强：动得慢、甜区大 */
function skillFac(v){return clamp((v-40)/60,0,1)}
function speedFac(v){return 1.2-0.55*skillFac(v)}   // 40→1.20倍速，70→0.93，100→0.65
function preciseW(){let w=7+30*skillFac(S.player.attrs.sho+(M&&M.fb||0));if(hasPerk('finisher'))w*=1.35;return w} // 精准区半宽：射门40→7px，70→22，100→37
function okW(){return 40+60*skillFac(S.player.attrs.sho+(M&&M.fb||0))} // 尚可区半宽：射门40→40px，100→100
function openKey(){
  // 进攻链设计：射门是唯一的完整小游戏；传球/盘带是前奏，成功可链入射门；
  // 任意球不再随机出现，只能由盘带被犯规链入
  const r=Math.random();
  if(r<0.27)openPass();
  else if(r<0.52)openDribble();
  else if(M.tac==='def'&&r<0.75)openShot(SITUS[0]); // 防反：反击单刀
  else openShot();
}
function openShot(forceSitu){
  const situ=forceSitu||rnd(SITUS);
  const A=S.player.attrs;
  let bspd=situ.bspd*speedFac(A.men+M.fb)*M.bFac; // 心理弱→滑块快，心理强→滑块慢；精力低→更快
  const kspd=situ.kspd*(0.82+M.gk*0.003);          // 门将评分高→移动更快
  if(M.min>60&&A.sta<70)bspd*=1.12;             // 体能差→下半场滑块变快
  if(hasPerk('bigheart'))bspd*=0.8;             // 大心脏：滑块减速
  G={mode:'shot',situ,bspd,kspd,phase:0,t:Math.random()*100,mx:240,my:160,aimX:0,aimY:0,
     marker:90,dir:1,kx:240,kxF:0,precise:false,ball:null,res:null,anim:0,animLen:22,
     wallX:situ.id==='fk'?240+ri(-45,45):0,wallW:situ.id==='fk'?(hasPerk('fkmaster')?32:46):0};
  $('gTitle').textContent=`${M.min}' 关键时刻 · ${situ.name}`;
  $('gHint').textContent=situ.id==='fk'?'第一步：点击球门选落点——绕开人墙，贴地或吊射死角！':'第一步：点击球门，选择射门落点';
  $('gBtns').innerHTML='';
  $('overlay').classList.remove('hidden');
  startLoop();
}
let LOOP=0;
function startLoop(){LOOP++;const id=LOOP;G.last=0;G.shown=false;requestAnimationFrame(ts=>loopG(id,ts))}
function cvPos(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};
}
cv.addEventListener('mousemove',e=>{if(!G)return;const p=cvPos(e);G.mx=p.x;G.my=p.y});
cv.addEventListener('click',e=>{
  if(!G)return;const p=cvPos(e);
  if(G.mode==='pass'){passClick(p);return}
  if(G.mode==='drib'){dribClick(p);return}
  if(G.phase===0){
    G.aimX=clamp(p.x,GOAL.x1+6,GOAL.x2-6);G.aimY=clamp(p.y,GOAL.y1+6,GOAL.y2-8);
    G.phase=1;
    $('gHint').textContent='第二步：指针停进绿色精准区、且门将远离落点时射门！';
  }else if(G.phase===1){shoot()}
});
function shoot(){
  const A=S.player.attrs,situ=G.situ;
  const sho=A.sho+M.fb; // 状态热度加成
  G.kxF=G.kx;
  const off=Math.abs(G.marker-240);
  const q=clamp(1-off/(okW()*2.5),0,1);   // 尚可区边缘 q=0.6，越靠中心越高
  G.precise=off<preciseW();               // 精准射门！
  let sig=situ.spread*(14+(100-sho)*2.6)*(1.55-q)*M.dFac;
  if(G.precise)sig*=0.3;
  const bx=G.aimX+g()*sig, by=G.aimY+g()*sig*0.75;
  M.shots++;
  G.animLen=Math.max(16,30-Math.round(sho*0.15)); // 射门高→球速快
  let res;
  if(situ.id==='fk'&&!G.precise&&Math.abs(bx-G.wallX)<G.wallW&&by>168){res='block';G.ball={x:bx,y:262};G.res=res;G.phase=2;G.anim=0;G.animLen=10;return} // 打在人墙上（精准射门可绕过）
  if(bx<GOAL.x1||bx>GOAL.x2||by<GOAL.y1)res='miss';
  else{
    let D=situ.reach*(120*(1.35-0.55*q)+40)*(1.06-sho*0.0035)*(0.78+M.gk*0.005)*(0.8+0.4*Math.random());
    if(by<115)D*=0.72; // 高角度更难扑
    const wowP=(G.precise?0.5:1)*clamp(0.03+M.gk*0.001,0.04,0.13); // 门将越强神扑越多
    res=Math.abs(bx-G.kxF)<D?'save':(Math.random()<wowP?'wow':'goal');
  }
  G.ball={x:bx,y:by};G.res=res;G.phase=2;G.anim=0;
}
function finishKey(){
  const res=G.res;
  if(M.penMode){ // 点球大战：不计入比分，进入结算
    G=null;$('overlay').classList.add('hidden');
    resolveShootout(res);return;
  }
  if(res==='goal'){M.goals++;M.gT++;updBoard();
    log(`${M.min}' ⚽ 球进了！！${S.player.name} 亲自破门得分！！`,'g');
    if(Math.random()<0.5)log(rnd(GOAL_CALLS).replace('＄',rnd(COMMS)),'y');
  }
  else if(res==='save'){M.saved++;const sd=Math.abs(G.ball.x-G.kxF);log(`${M.min}' ${S.player.name}的射门${sd<45?'角度太正，被门将稳稳挡出':'被门将飞身侧扑挡出'}！`,'y')}
  else if(res==='wow'){M.saved++;log(`${M.min}' 不可思议！对方门将飞身神扑，救下必进球！`,'y')}
  else if(res==='block'){M.saved++;log(`${M.min}' ${S.player.name}的任意球狠狠打在人墙上弹出！`,'y')}
  else{M.missed++;log(`${M.min}' 可惜！${S.player.name}的射门偏出了球门。`,'y')}
  G=null;$('overlay').classList.add('hidden');
  runTimer();
}
function loopG(id,ts){
  if(!G||id!==LOOP)return;
  // 按真实时间推进（以60fps为1），120Hz屏幕上滑块不会变快
  const dt=G.last?clamp((ts-G.last)/16.667,0.25,2.5):1;G.last=ts;
  G.t+=dt;
  if(G.mode==='pass'){
    drawP();
    if(G.phase===2){
      G.anim+=dt;
      if(G.anim>=36&&!G.shown){G.shown=true;
        const map={agoal:['⚽ 助攻！队友进球了！','var(--green)'],akey:['好球，可惜队友没打进','var(--gold)'],cut:['传球被断！','var(--red)'],'12':['🔁 撞墙配合！队友把球回敲！','var(--green)']};
        $('gHint').innerHTML=`<b style="color:${map[G.res][1]};font-size:16px">${map[G.res][0]}</b>`;
        $('gBtns').innerHTML=G.res==='12'?'<button class="btn" onclick="passShot()">接回传，起脚射门！</button>':'<button class="btn" onclick="finishPass()">继续比赛</button>';
      }
    }
    requestAnimationFrame(ts=>loopG(id,ts));
    return;
  }
  if(G.mode==='drib'){
    drawD();
    if(G.phase===2){
      G.anim+=dt;
      if(G.anim>=30&&!G.shown){G.shown=true;
        if(G.res==='win'){
          $('gHint').innerHTML=`<b style="color:var(--green);font-size:16px">${G.perfect?'🎯 时机完美！':''}⚡ 过掉了！单刀在前！</b>`;
          $('gBtns').innerHTML='<button class="btn" onclick="dribShot()">杀入禁区，射门！</button>';
        }else if(G.res==='foul'){
          $('gHint').innerHTML='<b style="color:var(--gold);font-size:16px">对方被迫犯规——任意球！</b>';
          $('gBtns').innerHTML='<button class="btn" onclick="dribFK()">主罚任意球</button>';
        }else{
          $('gHint').innerHTML='<b style="color:var(--red);font-size:16px">被后卫看穿，球被捅走了…</b>';
          $('gBtns').innerHTML='<button class="btn" onclick="finishDrib()">继续比赛</button>';
        }
      }
    }
    requestAnimationFrame(ts=>loopG(id,ts));
    return;
  }
  if(G.phase<2)G.kx=240+95*Math.sin(G.t*G.kspd);
  if(G.phase===1){
    G.marker+=G.dir*G.bspd*dt;
    if(G.marker>390){G.marker=390;G.dir=-1}
    if(G.marker<90){G.marker=90;G.dir=1}
  }
  drawG();
  if(G.phase===2){
    G.anim+=dt;
    if(G.anim>=G.animLen+6&&!G.shown){G.shown=true;
      const map={goal:['⚽ 球进了！！！','var(--green)'],save:['被门将扑出！','var(--gold)'],wow:['门将神扑！','var(--gold)'],miss:['射偏了…','var(--red)'],block:['被人墙挡住！','var(--red)']};
      let txt=map[G.res][0];
      if(G.precise&&G.res==='goal')txt='🎯 精准射门！'+txt;
      $('gHint').innerHTML=`<b style="color:${map[G.res][1]};font-size:16px">${txt}</b>`;
      $('gBtns').innerHTML='<button class="btn" onclick="finishKey()">继续比赛</button>';
    }
  }
  requestAnimationFrame(ts=>loopG(id,ts));
}

/* ---------- 传球小游戏 ---------- */
const PASS_AMP=40; // 防守人横移幅度
function laneW(){return 30-16*skillFac(S.player.attrs.pas+(M&&M.fb||0))} // 线路半宽：传球40→30px（只有一半时间是空档），100→14px（八成时间空档）
function openPass(){
  const names=shuffle(S.mates).slice(0,3);
  const sf=speedFac(S.player.attrs.pas+M.fb); // 传球弱→防守人横移快；传球强→慢
  G={mode:'pass',phase:0,t:0,anim:0,res:null,pick:null,q:0,clean:false,
     mates:[{x:120,y:150},{x:240,y:112},{x:360,y:150}].map((m,i)=>({
       ...m,name:names[i],spd:(0.05+Math.random()*0.04)*sf,ph:Math.random()*6.28}))};
  $('gTitle').textContent=`${M.min}' 关键时刻 · 助攻机会`;
  $('gHint').textContent='队友前插！等防守人离开线路（线路变绿）时点击队友送出直塞';
  $('gBtns').innerHTML='';
  $('overlay').classList.remove('hidden');
  startLoop();
}
function defX(m){return m.x+PASS_AMP*Math.sin(G.t*m.spd+m.ph)}
function laneOpen(m){return Math.abs(defX(m)-m.x)>=laneW()} // 防守人已让开线路（甜区）
function passClick(p){
  if(G.phase!==0)return;
  let idx=-1;
  G.mates.forEach((m,i)=>{if(Math.hypot(p.x-m.x,p.y-m.y)<42)idx=i});
  if(idx<0)return;
  const A=S.player.attrs,m=G.mates[idx];
  const open=Math.abs(defX(m)-m.x)/PASS_AMP; // 防守人离开线路的程度
  G.clean=laneOpen(m);                        // 在甜区内出球
  G.q=clamp(open*0.5+A.pas/100*0.4+(G.clean?0.1:-0.15)+g()*0.1+(S.chem-40)/250+(hasPerk('engine')?0.15:0),0,1);
  G.pick=idx;G.phase=2;G.anim=0;
  const pCut=G.clean?(1-G.q)*0.25:0.35+(1-G.q)*0.4; // 硬塞进被堵的线路，大概率被断
  if(Math.random()<pCut)G.res='cut';
  else{
    const pGoal=clamp(0.22+0.5*G.q-(M.gk-60)*0.004,0.1,0.75);
    const r2=Math.random();
    if(r2<pGoal)G.res='agoal';
    else if(G.q>0.45&&r2<pGoal+0.24)G.res='12'; // 撞墙配合：队友回做，链入射门
    else G.res='akey';
  }
}
function passShot(){
  log(`${M.min}' 精妙的二过一！${G.mates[G.pick].name}将球回敲，${S.player.name}在禁区前沿拿球！`,'g');
  G=null;openShot(SITUS[1]);
}
function finishPass(){
  const m=G.mates[G.pick],res=G.res;
  if(res==='agoal'){M.assists++;M.gT++;updBoard();log(`${M.min}' 你的直塞撕开防线，${m.name}单刀推射破门！（助攻+1）`,'g')}
  else if(res==='akey'){M.keyp++;log(`${M.min}' 你送出极具威胁的传球，可惜${m.name}的射门被挡出。`,'y')}
  else{M.badpass++;log(`${M.min}' 你的传球线路被后卫识破，断掉了。`,'y')}
  G=null;$('overlay').classList.add('hidden');
  runTimer();
}
/* ---------- 盘带过人小游戏 ---------- */
function leanThr(){return 0.8-0.45*skillFac(S.player.attrs.dri+(M&&M.fb||0))} // 突破时机阈值：盘带40→重心要偏到0.8才算时机，100→0.35就够
function openDribble(){
  const sf=speedFac(S.player.attrs.dri+M.fb); // 盘带弱→后卫晃得快，难读；盘带强→慢
  G={mode:'drib',phase:0,t:0,anim:0,res:null,side:0,perfect:false,
     lspd:(0.055+Math.random()*0.05)*sf,ph:Math.random()*6.28};
  $('gTitle').textContent=`${M.min}' 关键时刻 · 1v1盘带过人`;
  $('gHint').textContent='后卫堵在你身前——等他重心明显偏向一侧（那侧亮起"突破时机"）时，点击另一侧突破！';
  $('gBtns').innerHTML='';
  $('overlay').classList.remove('hidden');
  startLoop();
}
function dribLean(){return Math.sin(G.t*G.lspd+G.ph)} // 正=后卫重心偏右
function dribClick(p){
  if(G.phase!==0)return;
  const side=p.x<240?-1:1;
  const lean=dribLean(),A=S.player.attrs;
  const read=(-Math.sign(lean)===side?1:-1)*Math.abs(lean); // 反重心突破的读取质量
  G.perfect=read>=leanThr();                                  // 在甜区内出脚
  const pWin=clamp(0.36+read*0.4+(G.perfect?0.14:0)+((A.dri+A.pac)/2-60)*0.008+(hasPerk('flash')?0.15:0)+(M.fb>0?0.04:M.fb<0?-0.04:0),0.08,0.95);
  G.side=side;G.phase=2;G.anim=0;
  const r=Math.random();
  G.res=r<pWin?'win':(r<pWin+0.18?'foul':'lose');
}
function dribShot(){log(`${M.min}' 一记漂亮的变向！${S.player.name}过掉后卫杀入禁区！`,'g');G=null;openShot(SITUS[0])}
function dribFK(){log(`${M.min}' 后卫被晃得重心全失，只能将你放倒——前场任意球！`,'y');G=null;openShot(FK_SITU)}
function finishDrib(){
  log(`${M.min}' ${S.player.name}的突破被后卫化解，球权丢失。`,'y');
  G=null;$('overlay').classList.add('hidden');
  runTimer();
}
function drawD(){
  ctx.clearRect(0,0,480,330);
  const gr=ctx.createLinearGradient(0,0,0,330);
  gr.addColorStop(0,'#45a565');gr.addColorStop(1,'#2f8a4f');
  ctx.fillStyle=gr;ctx.fillRect(0,0,480,330);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.035)':'transparent';ctx.fillRect(0,i*42,480,42)}
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2;
  ctx.strokeRect(110,0,260,78);
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(186,2,108,16);
  const lean=G.phase===0?dribLean():0;
  // 两侧突破提示区
  if(G.phase===0){
    // lean>0=后卫重心偏右→应从左路突破（与dribClick判定一致：提示亮在该点击的一侧）
    const thr=leanThr(),hotL=lean>=thr,hotR=-lean>=thr;
    const a=0.06+0.10*Math.max(0,lean)+(hotL?0.12:0),b=0.06+0.10*Math.max(0,-lean)+(hotR?0.12:0);
    ctx.fillStyle=`rgba(87,184,123,${a})`;ctx.fillRect(0,90,200,240);
    ctx.fillStyle=`rgba(87,184,123,${b})`;ctx.fillRect(280,90,200,240);
    ctx.font='bold 15px sans-serif';ctx.textAlign='center';
    ctx.fillStyle=hotL?'#a7f3c4':'rgba(255,255,255,.55)';ctx.fillText(hotL?'⚡ 突破时机！':'← 左路突破',100,315);
    ctx.fillStyle=hotR?'#a7f3c4':'rgba(255,255,255,.55)';ctx.fillText(hotR?'⚡ 突破时机！':'右路突破 →',380,315);
    // 重心仪：显示后卫重心与甜区阈值
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(180,60,120,8);
    ctx.fillStyle='rgba(87,184,123,.6)';ctx.fillRect(180,60,60*(1-thr),8);ctx.fillRect(240+60*thr,60,60*(1-thr),8);
    ctx.fillStyle='#fff';ctx.fillRect(240+lean*58-2,57,4,14);
    ctx.font='10px sans-serif';ctx.fillStyle='rgba(255,255,255,.5)';ctx.textAlign='center';
    ctx.fillText(`后卫重心 · 时机窗口 ← 盘带${S.player.attrs.dri}`,240,94);
  }
  // 后卫（红）：重心偏移
  if(G.phase<2)drawMini(240+lean*30,150,'#b56f63','#8a4b41','#402c28',G.t*0.14,1);
  else{ // 结果动画
    const p1=Math.min(G.anim/26,1);
    if(G.res==='win'){
      drawMini(240-G.side*24*p1,150+8*p1,'#b56f63','#8a4b41','#402c28',1.5,1); // 被晃倒方向错误
      drawMini(240+G.side*70*p1,286-150*p1,'#f8fafc','#cbd5e1','#31473a',G.t*0.25,1);
      drawBall2(240+G.side*70*p1+10,286-150*p1+24,6);
    }else if(G.res==='foul'){
      drawMini(240+G.side*30*p1,150+20*p1,'#b56f63','#8a4b41','#402c28',2.2,1);
      drawMini(240+G.side*40*p1,286-100*p1,'#f8fafc','#cbd5e1','#31473a',p1>0.7?2.8:G.t*0.25,1);
      if(p1>=1){ctx.fillStyle='#f5d90a';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('🟨 犯规！',240,120)}
    }else{
      drawMini(240+lean*10,150,'#b56f63','#8a4b41','#402c28',G.t*0.14,1);

      drawMini(240+G.side*30*p1,286-40*p1,'#f8fafc','#cbd5e1','#31473a',G.t*0.1,1);

}
function drawMini(x,y,c1,c2,shorts,run,sc){
  // 迷你球员：run为摆腿相位，sc缩放
  sc=sc||1;
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath();ctx.ellipse(0,27,15,4.5,0,0,7);ctx.fill();
  const sw=Math.sin(run)*5;
  ctx.lineCap='round';
  // 腿
  ctx.strokeStyle='#0f172a';ctx.lineWidth=5.5;
  ctx.beginPath();ctx.moveTo(-4,8);ctx.lineTo(-5+sw,25);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,8);ctx.lineTo(5-sw,25);ctx.stroke();
  // 球鞋
  ctx.fillStyle='#111827';
  ctx.beginPath();ctx.ellipse(-5+sw,26,5,2.5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(5-sw,26,5,2.5,0,0,7);ctx.fill();
  // 短裤
  ctx.fillStyle=shorts;
  roundRect(-8.5,0,17,11,3);
  // 球衣
  const jg=ctx.createLinearGradient(-10,0,10,0);
  jg.addColorStop(0,c1);jg.addColorStop(1,c2);
  ctx.fillStyle=jg;
  roundRect(-9.5,-17,19,20,4.5);
  // 手臂
  ctx.strokeStyle=c2;ctx.lineWidth=4.5;
  ctx.beginPath();ctx.moveTo(-8,-13);ctx.lineTo(-12,1-sw*0.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,-13);ctx.lineTo(12,1+sw*0.6);ctx.stroke();
  // 头+头发
  ctx.fillStyle='#f1c27d';
  ctx.beginPath();ctx.arc(0,-24,6.5,0,7);ctx.fill();
  ctx.fillStyle='#292018';
  ctx.beginPath();ctx.arc(0,-25.5,6.5,Math.PI,Math.PI*2);ctx.fill();
  ctx.restore();
}

function crosshair(x,y,c){
  ctx.strokeStyle=c;ctx.lineWidth=2;

}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();ctx.fill();
}
function glove(x,y){
  ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(x,y,5.5,0,7);ctx.fill();
  ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;ctx.stroke();
}
function drawKeeper(kx,dive){
  // 阴影
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(kx,251,28,6,0,0,7);ctx.fill();
  ctx.save();
  if(dive){ctx.translate(kx,228);ctx.rotate(dive);ctx.translate(-kx,-228)}
  const sway=dive?0:Math.sin(G.t*0.09)*2;
  ctx.lineCap='round';
  // 腿
  ctx.strokeStyle='#0f172a';ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(kx-8,210);ctx.lineTo(kx-12,244);ctx.stroke();
  ctx.beginPath();ctx.moveTo(kx+8,210);ctx.lineTo(kx+12,244);ctx.stroke();
  // 球袜
  ctx.strokeStyle='#a3652f';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(kx-11,232);ctx.lineTo(kx-12,243);ctx.stroke();
  ctx.beginPath();ctx.moveTo(kx+11,232);ctx.lineTo(kx+12,243);ctx.stroke();
  // 球鞋
  ctx.fillStyle='#111827';
  ctx.beginPath();ctx.ellipse(kx-14,247,8,4,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(kx+14,247,8,4,0,0,7);ctx.fill();
  // 短裤
  ctx.fillStyle='#1e293b';
  roundRect(kx-15,194,30,20,5);
  // 躯干球衣（渐变+袖口）
  const jg=ctx.createLinearGradient(kx-17,0,kx+17,0);
  jg.addColorStop(0,'#c98a4f');jg.addColorStop(.5,'#b8763a');jg.addColorStop(1,'#8a5427');
  ctx.fillStyle=jg;
  roundRect(kx-17,157,34,42,8);
  // 号码
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
  ctx.fillText('1',kx,186);
  // 手臂+手套：扑救时双臂伸向侧上方，站立时垂在体侧微晃
  ctx.strokeStyle='#b8763a';ctx.lineWidth=8;
  if(dive){
    const d=Math.sign(dive);
    ctx.beginPath();ctx.moveTo(kx-6,164);ctx.lineTo(kx+d*40,146);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx+6,168);ctx.lineTo(kx+d*46,160);ctx.stroke();
    glove(kx+d*40,146);glove(kx+d*46,160);
  }else{
    ctx.beginPath();ctx.moveTo(kx-14,164);ctx.lineTo(kx-26,193+sway);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx+14,164);ctx.lineTo(kx+26,193-sway);ctx.stroke();
    glove(kx-26,196+sway);glove(kx+26,196-sway);
  }
  // 头+头发
  ctx.fillStyle='#f1c27d';
  ctx.beginPath();ctx.arc(kx,143,11,0,7);ctx.fill();
  ctx.fillStyle='#292018';
  ctx.beginPath();ctx.arc(kx,141,11,Math.PI,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ============ 赛后 ============ */
function addResult(ia,ga,ib,gb){
  const ra=S.table.find(r=>r.i===ia),rb=S.table.find(r=>r.i===ib);
  ra.P++;rb.P++;ra.GF+=ga;ra.GA+=gb;rb.GF+=gb;rb.GA+=ga;
  if(ga>gb){ra.W++;rb.L++;ra.Pts+=3}
  else if(ga<gb){rb.W++;ra.L++;rb.Pts+=3}
  else{ra.D++;rb.D++;ra.Pts++;rb.Pts++}
}
function endMatch(){
  if(M.cup){endCupMatch();return}
  if(M.club){endClubMatch();return}
  const p=S.player;
  log('—— 全场比赛结束 ——','d');
  addResult(0,M.gT,M.fx.opp,M.gO);
  // 其余球队比赛
  const rest=shuffle(Array.from({length:S.teams.length-1},(_,i)=>i+1).filter(i=>i!==M.fx.opp));
  for(let i=0;i<rest.length-1;i+=2){
    const a=rest[i],b=rest[i+1];
    addResult(a,pois(clamp(1.3+(S.teams[a].str-S.teams[b].str)*0.04,0.2,2.6)),
              b,pois(clamp(1.3+(S.teams[b].str-S.teams[a].str)*0.04,0.2,2.6)));
  }
  // 评分
  const win=M.gT>M.gO,draw=M.gT===M.gO;
  let rating=6.0+M.goals*0.95+M.assists*0.7+M.keyp*0.15+M.saved*0.1-M.missed*0.35-M.badpass*0.15+(win?0.4:draw?0.1:-0.3);
  rating=Math.round(clamp(rating,4,10)*10)/10;
  const tpGain=Math.max(0,Math.floor(rating-5.5))+M.goals;
  // 精力消耗 & 信任变化
  const eCost=Math.round((M.bench?18:30)-p.attrs.sta*0.1-(p.items.physio?6:0)-(p.items.jet?4:0)-(hasPerk('ironman')?4:0));
  p.energy=clamp(p.energy-eCost,0,100);
  // 伤病风险：精力越低越危险
  let injNote='';

  }

  p.trust=clamp(p.trust+tDelta,5,99);
  M.tDelta=tDelta;
  // 球探关注：高光表现累积，平庸缓慢流失
  p.scout=clamp(p.scout+(rating>=8?4:rating>=7?2:0)+M.goals-1,0,100);
  p.tp+=tpGain;p.apps++;p.goals+=M.goals;p.assists+=M.assists;p.ratings.push(rating);
  p.careerApps++;p.careerGoals+=M.goals;p.careerAssists+=M.assists;

  p.form=clamp(p.form+(rating>=7.5?12:rating>=6.5?4:rating<6?-12:-4),0,100);
  S.chem=clamp(S.chem+(win?2:draw?1:0)+(M.assists>0?1:0),35,100);
  if(S.rivals)S.rivals.forEach(r=>r.g+=pois(r.rate));
  S.round++;
  const newAch=checkAch(),newPerks=checkPerks();

  $('rVs').textContent=`${M.fx.home?'主场':'客场'} vs ${M.opp.name} · ${win?'胜利 🎉':draw?'战平':'告负'}`;
  $('rRate').textContent=rating.toFixed(1);
  $('rRateBox').className='rate'+(rating<6?' bad':'');
  $('rGoals').textContent=M.goals;
  $('rAssists').textContent=M.assists;
  $('rShots').textContent=M.shots;
  $('rTp').textContent='+'+tpGain;
  const perf=rating>=8.5?'🌟 全场最佳表现！球探席上有人频频记录…':rating>=7?'教练对你的表现很满意。':rating<5.5?'表现低迷，下场要拿出态度。':'';
  const achNote=newAch.map(a=>`<br><span style="color:var(--gold)">🏅 解锁成就【${a.n}】</span>`).join('')+
    newPerks.map(pk=>`<br><span style="color:var(--gold)">✨ 解锁特技【${pk.n}】${pk.d}</span>`).join('');
  $('rNote').innerHTML=(perf?perf+'<br>':'')+
    `教练信任 <b style="color:var(--blue)">${p.trust}</b>（${tDelta>=0?'+':''}${tDelta}） · 精力剩余 <b style="color:var(--gold)">${p.energy}</b> · 球探关注 <b style="color:var(--green)">${p.scout}</b><br>本周收入 <b style="color:var(--gold)">+${income}万</b>（存款 ${p.money}万）`+injNote+achNote;
  $('rSeason').innerHTML='';
  $('rBtn').textContent=S.round>=S.rounds?'查看赛季总结':'继续';
  $('rBtn').onclick=afterResult;
  show('scResult');save();

function resolveShootout(res){

function settleClub(penWin){
  const p=S.player;
  const win=penWin!==undefined?penWin:M.gT>M.gO;
  const draw=penWin===undefined&&M.gT===M.gO;
  let rating=6.0+M.goals*0.95+M.assists*0.7+M.keyp*0.15+M.saved*0.1-M.missed*0.35-M.badpass*0.15+(win?0.4:draw?0.1:-0.3);

  $('rShots').textContent=M.shots;$('rTp').textContent='+'+tpGain;
  $('lb3').textContent='射门';$('lb4').textContent='获得训练点';

  $('rSeason').innerHTML='';

function genOffers(pos,avg){
  const p=S.player,myStr=S.teams[0].str,offers=[],l=LG(),ov=overall();
  const usedNames=new Set([S.teams[0].name]);
  const pick=(lg,minStr,maxStr,strict)=>{ // 从某联赛挑一支实力在区间内的球队
    const L=LEAGUES[lg];
    const cand=shuffle(L.teams.filter(o=>!usedNames.has(o.n)&&o.s>=minStr&&o.s<=maxStr))[0]
      ||(strict?null:shuffle(L.teams.filter(o=>!usedNames.has(o.n)))[0]);
    if(!cand)return;
    usedNames.add(cand.n);
    offers.push({name:cand.n,c1:cand.c1,c2:cand.c2,p:cand.p||[],lg,str:cand.s});
  };
  const eu2=['en2','es2','it2','de2','fr2'],eu1=['en1','es1','it1','de1','fr1'];
  if(p.scout>=25&&avg>=6.8)pick(S.lg,myStr+3,myStr+12,true);                  // 同联赛更强的球队（没有更强的就不报价）
  const up=upLeague();
  if(up&&p.scout>=45&&avg>=7.0)pick(up.id,up.base,up.base+10);                 // 上一级中游
  if(up&&p.scout>=70&&avg>=7.4)pick(up.id,up.base+10,99);                      // 上一级豪门
  if(S.lg==='cn1'&&p.scout>=50&&avg>=7.0&&ov>=74)pick(rnd(eu2),0,99);          // 留洋：欧洲次级联赛
  if(S.lg==='cn1'&&p.scout>=80&&avg>=7.3&&ov>=82)pick(rnd(eu1),0,92);          // 留洋：五大联赛！
  if(!isCN()&&l.level===2&&p.scout>=70&&avg>=7.4&&ov>=80)pick(rnd(eu1.filter(x=>x!==up.id)),0,92); // 其他国家顶级联赛
  if(!isCN()&&l.level===1&&p.scout>=70&&avg>=7.4&&ov>=85)pick(rnd(eu1.filter(x=>x!==S.lg)),myStr+2,99);   // 跨国豪门
  return offers;
}
function seasonEnd(){

  const pos=rows.findIndex(r=>r.i===0)+1;
  const avg=p.ratings.length?p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length:6;

  let bonus=0,lines=[];
  if(S.cupLines){lines.push(...S.cupLines,'———');S.cupLines=null} // 国家队大赛回顾
  // 亚冠淘汰赛（模拟）
  if(S.aclActive&&S.aclGroup&&S.aclGroup.idx>=3){
    const g=S.aclGroup,cn=contName();
    lines.push(`${cn}小组赛：${g.rec.join('；')}（积${g.pts}分）`);
    if(g.pts>=5||(g.pts>=4&&Math.random()<0.6)){
      const stages=[`${cn}1/4决赛`,`${cn}半决赛`,`${cn}决赛`];
      const myStr=S.teams[0].str+(overall()-55)*0.35;
      const opps=shuffle(contPool().filter(o=>!g.opps.some(x=>x.name===o[0])));
      let w=0;
      for(;w<3;w++){
        const o=opps[w];
        const win=Math.random()<clamp(0.5+(myStr-o[1])*0.03,0.1,0.85);
        lines.push(`${stages[w]} vs ${o[0]}：${win?'获胜！':'惜败。'}`);
        if(!win)break;
      }
      const pz=LG().cont==='ucl'?1500:300;
      if(w===3){p.honors.push(`第${p.season}季${cn}冠军`);p.money+=pz;p.earnings+=pz;p.pop=clamp(p.pop+20,0,100);
        lines.push(`👑 ${LG().cont==='ucl'?'欧洲之巅':'亚洲之巅'}！${cn}冠军！奖金+${pz}万，人气+20`)}
      else if(w===2)lines.push('止步决赛，虽败犹荣。');
    }else lines.push(`${cn}小组赛未能出线。`);
  }
  lines.push(`${LG().name}排名：第 ${pos} 名`);
  lines.push(`赛季数据：${p.apps}场 ${p.goals}球 ${p.assists}助攻，场均评分 ${avg.toFixed(2)}`);
  // 赛季履历
  p.history.push({s:p.season,team:S.teams[0].name,lg:LG().name.slice(0,2),apps:p.apps,g:p.goals,a:p.assists,avg:avg.toFixed(2),pos});
  // 宿敌之争
  if(S.nemesis){
    const ng=pois(0.6)+Math.round(8+Math.random()*14);
    S.nemesis.sg=ng;S.nemesis.g+=ng;
    lines.push(p.goals>ng?`😈 宿敌${S.nemesis.n}本季${ng}球——你用${p.goals}球狠狠压过了他！`
      :p.goals===ng?`😈 宿敌${S.nemesis.n}和你同进${ng}球，胜负未分。`
      :`😈 宿敌${S.nemesis.n}本季轰入${ng}球，媒体嘲讽你只有${p.goals}球……明年见！`);
  }
  // 军令状结算
  if(S.task){
    const rankOK=pos<=S.task.rank, goalOK=p.goals>=S.task.goals;
    if(rankOK){p.trust=clamp(p.trust+8,5,99);bonus+=3;lines.push(`📋 军令状达成（联赛前${S.task.rank}）！信任+8，训练点+3`)}
    if(goalOK){p.trust=clamp(p.trust+5,5,99);bonus+=3;lines.push(`📋 进球任务达成（${p.goals}/${S.task.goals}球）！信任+5，训练点+3`)}
    if(!rankOK&&!goalOK){p.trust=clamp(p.trust-10,5,99);lines.push(`📋 军令状全部落空……${S.coach}指导大发雷霆，信任-10`)}
  }
  // 下赛季亚冠资格
  if(LG().cont==='acl'&&pos<=3){S.aclNext=true;lines.push('🎫 联赛前三——获得下赛季亚冠参赛资格！')}
  if(LG().cont==='ucl'&&pos<=4){S.aclNext=true;lines.push('🎫 联赛前四——获得下赛季欧冠参赛资格！')}
  if(champ){
    const top1=LG().level===1;
    p.honors.push(`第${p.season}季${LG().name}冠军`);bonus+=5;
    lines.push(`🏆 ${LG().name}冠军！训练点 +5`+(top1&&isCN()?'——你登顶了中国足坛！':top1?'——你征服了'+LG().name.slice(0,2)+'！':''));
    if(top1&&isCN()&&!p.honors.includes('足坛之巅'))p.honors.push('足坛之巅');
    if(top1&&!isCN()&&!p.honors.includes('欧洲之王'))p.honors.push('欧洲之王');
  }
  const topRival=S.rivals?Math.max(...S.rivals.map(r=>r.g)):99;
  if(p.goals>topRival){p.honors.push(`第${p.season}季最佳射手`);bonus+=3;lines.push(`👟 力压群雄（${p.goals}球），联赛最佳射手！训练点 +3`)}
  else if(S.rivals){const tr=S.rivals.find(r=>r.g===topRival);lines.push(`射手王被${tr.n}（${tr.team}，${topRival}球）拿走，你${p.goals}球位列其后。`)}
  if(avg>=8.0){p.honors.push(`第${p.season}季MVP`);bonus+=3;lines.push('🌟 联赛MVP！训练点 +3')}
  else if(avg>=7.2){bonus+=2;lines.push('表现出色，训练点 +2')}
  if(LG().level===1&&champ&&avg>=8.0){
    p.honors.push(`第${p.season}季金球奖`);p.pop=clamp(p.pop+20,0,100);
    lines.push('👑 金球奖！你是这个星球最好的球员！人气+20');
  }
  // 赞助商按人气自动升级
  for(const[th,nm,wk]of[[30,'动力运动饮料',2],[60,'疾风球鞋',8],[85,'寰宇航空',25],[95,'环球体育巨头',60]])
    if(p.pop>=th&&(p.sponsor.weekly||0)<wk){p.sponsor={name:nm,weekly:wk};lines.push(`🤝 新赞助合同：${nm}（每周 +${wk}万）`)}
  p.tp+=bonus;
  // 冲级：带队夺冠且不在顶级联赛
  S.promote=champ&&!!upLeague();
  if(S.promote)lines.push(`🎉 球队夺得冠军，成功冲入${upLeague().name}！`);
  // 赛季末成就检查
  checkAch().forEach(a=>lines.push(`🏅 解锁成就【${a.n}】：${a.d}`));
  // 转会报价
  S.offers=genOffers(pos,avg);
  S.seasonAvg=avg;
  // 续约谈判资格：表现出色可谈条件
  S.nego=avg>=7.0&&!S.negoDone?{done:false}:null;
  let offerHtml='';
  if(S.nego)offerHtml+=`<h2 style="margin-top:14px">🖋️ 续约谈判</h2><div id="negoBox" class="row" style="background:var(--card2);border-left:3px solid var(--green);padding:10px 12px;margin-top:8px">
    <div class="grow" style="font-size:13.5px">俱乐部想和你谈续约——出色的赛季给了你筹码。</div>
    <button class="btn" onclick="nego(0)">要求涨薪30%</button>
    <button class="btn ghost" onclick="nego(1)">要求签字费</button></div>`;
  if(S.offers.length){
    offerHtml='<h2 style="margin-top:14px">📨 转会报价</h2>'+S.offers.map((o,i)=>
      `<div class="row" style="background:var(--card2);border-left:3px solid var(--green);padding:10px 12px;margin-top:8px">
        <div class="grow">${badge(o,20)}<b>${o.name}</b> <span style="color:var(--dim);font-size:13px">${LEAGUES[o.lg].name} · 球队实力 ${o.str}</span></div>
        <button class="btn" onclick="acceptOffer(${i})">接受转会</button></div>`).join('')+
      '<p style="color:var(--dim);font-size:12px;margin-top:8px">转会后教练信任重置为45，需要重新证明自己。</p>';
  }else if(p.scout<25){
    offerHtml='<p style="color:var(--dim);margin-top:10px">没有收到报价——用进球和高评分吸引球探吧（关注度25+开始有报价）。</p>';
  }
  $('rScore').textContent=`第${p.season}赛季结束`;
  $('rVs').textContent='';
  $('rRateBox').className='rate';$('rRate').textContent=avg.toFixed(2);
  document.querySelector('#rRateBox span').textContent=' 赛季场均评分';
  const retireHtml=p.age>=30?`<div class="center" style="margin-top:12px"><button class="btn ghost" onclick="retire()">宣布退役，挂靴谢幕</button></div>`:'';
  $('rSeason').innerHTML='<div class="card mt" style="text-align:left">'+lines.map(l=>`<p style="line-height:2">${l}</p>`).join('')+offerHtml+retireHtml+'</div>';
  $('rBtn').textContent=S.promote?`随${S.teams[0].name}征战${upLeague().name}`:`留在${S.teams[0].name}，进入新赛季`;
  $('rBtn').onclick=()=>{
    if(S.promote){const up=upLeague();S.lg=up.id;S.teams[0].str=Math.max(S.teams[0].str+4,up.base-2)}
    startNewSeason();
  };
  show('scResult');save();
}
function nego(t){ // 续约谈判
  const p=S.player;
  if(!S.nego||S.nego.done)return;
  S.nego.done=true;S.negoDone=true;
  let msg;
  if(t===0){p.wageUp=(p.wageUp||0)+0.3;p.wage=calcWage();msg=`✅ 谈成了！周薪上涨30%（现在 ${p.wage}万/周）`}
  else{const b=Math.round(ri(15,30)*tf());p.money+=b;p.earnings+=b;msg=`✅ 一次性签字费 +${b}万 到账！`}
  $('negoBox').innerHTML=`<div class="grow" style="color:var(--green);font-weight:700">${msg}</div>`;
  save();
}
function acceptOffer(i){
  const o=S.offers[i],p=S.player;
  p.trust=45;p.scout=clamp(p.scout-20,0,100);
  p.wageUp=0; // 新东家重新谈薪
  S.lg=o.lg;
  S.teams[0]={name:o.name,c1:o.c1,c2:o.c2,str:o.str,p:o.p||[]};
  S.justMoved=true;
  if(!isCN()&&!p.honors.includes('留洋先驱'))p.honors.push('留洋先驱');
  startNewSeason();
}
function startNewSeason(){
  const p=S.player,avg=S.seasonAvg||6;
  if(p.age>=35){retire();return} // 岁月不饶人
  document.querySelector('#rRateBox span').textContent=' 本场评分';
  $('rBtn').onclick=afterResult;
  p.season++;p.age++;
  // 年龄曲线：小将成长快，老将机能衰退
  S.ageNote='';
  if(p.age<=20){p.tp+=2;S.ageNote='青春正盛：额外训练点+2'}
  else if(p.age>=31){
    const d1=ri(1,2),d2=ri(0,2);
    p.attrs.pac=clamp(p.attrs.pac-d1,30,95);p.attrs.sta=clamp(p.attrs.sta-d2,30,95);
    if(p.attrs.men<92)p.attrs.men+=1;
    S.ageNote=`岁月不饶人：速度-${d1}${d2?`、体能-${d2}`:''}，但心理+1（经验老到）`;
  }
  p.energy=100;p.trust=clamp(p.trust+5,5,99);p.injury=0; // 休赛期满血回归
  p.apps=0;p.goals=0;p.assists=0;p.ratings=[];
  S.teams[0].str+=clamp(Math.round((avg-6)*2),0,4);
  S.teams=makeTeams(S.lg,S.teams[0]);
  S.rounds=(S.teams.length-1)*2;
  rollSquad(S.justMoved);S.justMoved=false; // 新赛季队友与教练更迭
  newSeasonComps(); // 杯赛/军令状/射手榜/状态重置
  S.negoDone=false;S.nego=null;
  p.wage=calcWage();
  S.offers=[];S.promote=false;
  S.round=0;S.table=freshTable();S.schedule=makeSchedule();
  save();goHome();
  if(S.ageNote){
    $('evTitle').textContent=`第${p.season}赛季 · ${p.age}岁`;
    $('evText').textContent=S.ageNote;
    $('evBtns').innerHTML='<button class="btn" onclick="$(\'evOverlay\').classList.add(\'hidden\')">开始新赛季</button>';
    $('evOverlay').classList.remove('hidden');
  }
}
function retire(){
  const p=S.player,hn=p.honors;
  const cnt=t=>hn.filter(h=>h.includes(t)).length;
  const score=p.careerGoals+cnt('冠军')*15+cnt('射手')*8+cnt('MVP')*8+cnt('金球')*40
    +(hn.includes('足坛之巅')?50:0)+(hn.includes('欧洲之王')?60:0)+Math.round(p.earnings/50)+(p.items.academy?100:0)
    +Object.keys(p.ach||{}).length*3+(p.love>=3?10:0);
  const grade=score>=220?'S':score>=130?'A':score>=70?'B':score>=35?'C':'D';
  const gtxt={S:'传奇！你的名字将被写进足球史册。',A:'豪门核心，一代球迷心中的英雄。',
    B:'扎实的职业生涯，问心无愧。',C:'平凡但真实的足球人生。',D:'至少，你曾追过梦。'}[grade];
  $('rScore').textContent='职业生涯落幕';
  $('rVs').textContent=`${p.name}，${p.age}岁正式挂靴`;
  $('rRateBox').className='rate';$('rRate').textContent=grade;
  document.querySelector('#rRateBox span').textContent=' 生涯评级';
  $('rGoals').textContent=p.careerGoals;
  $('rAssists').textContent=p.careerAssists;
  $('rShots').textContent=p.careerApps;$('lb3').textContent='出场';
  $('rTp').textContent=p.earnings+'万';$('lb4').textContent='生涯总收入';
  $('rNote').innerHTML=`<b>${gtxt}</b>`;
  $('rSeason').innerHTML='<div class="card mt" style="text-align:left"><p style="line-height:2">'+
    `效力${p.season}个赛季 · 生涯${p.careerGoals}球${p.careerAssists}助攻 · 国家队${p.caps||0}场${p.ntGoals||0}球</p>`+
    (hn.length?`<p style="line-height:2" class="honor">🏆 ${hn.join('、')}</p>`:'<p style="color:var(--dim)">未获得荣誉</p>')+'</div>';
  $('rBtn').textContent='开启新的足球人生';
  $('rBtn').onclick=()=>{localStorage.removeItem('yqcm1');location.reload()};
  show('scResult');
}
</script>
</body>
</html>
